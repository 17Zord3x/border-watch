<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1017">
<title>Border Watch</title>
<style>
/* Design language: dense dark analyst workspace (inspired by the open-source Blueprint UI system). */
:root{
 --bg:#111418;--panel:#1C2127;--panel2:#252A31;--panel3:#2F343C;--line:#383E47;--line2:#2F343C;
 --ink:#F6F7F9;--mute:#ABB3BF;--dim:#738091;
 --acc:#4C90F0;--acc2:#2D72D2;--green:#32A467;--amber:#EC9A3C;--red:#E76A6E;--violet:#9881F3;
 --mono:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
 --hdr:98px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.43 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
svg.i{display:inline-block;vertical-align:-3px;flex:none}
.mute{color:var(--mute)}.ok{color:#72CA9B}.no{color:#FA999C}.wn{color:#FBB360}
.sm{font-size:12.5px}
/* header */
.hdr{position:sticky;top:0;z-index:7}
.classbar{height:18px;background:#1C6E42;color:#E6F5EC;font:700 10.5px/18px var(--mono);letter-spacing:.14em;text-align:center;text-transform:uppercase}
.top{height:46px;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel2);box-shadow:0 1px 0 rgba(17,20,24,.6),0 1px 1px rgba(17,20,24,.4)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.06em;font-size:14px;min-width:0}
.brand .crumb{font-weight:400;letter-spacing:0;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;border-left:1px solid var(--line)}
.brand .crumb i{font-style:normal;color:var(--dim);margin:0 4px}
.clock{font:600 16px var(--mono);color:var(--ink);margin-left:auto;padding:0 8px;letter-spacing:.04em}
.ib{background:transparent;border:0;border-radius:2px;min-width:34px;height:32px;padding:0 8px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ib:hover{background:rgba(143,153,168,.15);color:var(--ink)}
.ib.on{background:var(--acc2);color:#fff}
.flow{height:34px;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.flow span{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:var(--dim);white-space:nowrap}
.flow span b{font:600 10px var(--mono);width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:2px;background:var(--panel3);color:var(--mute)}
.flow span.d{color:#72CA9B}.flow span.d b{background:rgba(35,133,81,.3);color:#72CA9B}
.flow span.c{color:var(--ink);background:rgba(45,114,210,.2)}.flow span.c b{background:var(--acc2);color:#fff}
.flow em{color:var(--line);font-style:normal}
/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:calc(100vh - var(--hdr))}
.mapcol{position:relative;background:#10161D;border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
svg.map{width:100%;flex:1;min-height:0;display:block}
svg.map text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;pointer-events:none}
.chips{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;right:8px}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(17,20,24,.88);border:1px solid var(--line);border-radius:2px;padding:2px 7px;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.chip.hot{border-color:var(--red);color:#FA999C}
.chip.busy{border-color:var(--amber);color:#FBB360}
.ticker{background:var(--panel);border-top:1px solid var(--line2);padding:7px 12px;font:12px var(--mono);min-height:34px;color:var(--ink)}
.ticker .tm{color:var(--acc);margin-right:8px}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line2)}
.tab{background:none;border:0;padding:8px 2px 7px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.tab.dec{color:var(--amber)}
.tab:disabled{opacity:.4}
.tab .bd{position:absolute;top:5px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.body{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.hint{display:flex;gap:8px;align-items:flex-start;background:rgba(45,114,210,.15);border-left:3px solid var(--acc2);border-radius:2px;padding:8px 10px;font-size:13px}
.hint svg{color:var(--acc);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:10px 12px 12px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card>.lbl{margin:-10px -12px 10px;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line2);border-radius:3px 3px 0 0}
.verdict{font-size:16px;font-weight:600}
.tri{display:flex;height:6px;border-radius:1px;overflow:hidden;margin-top:8px;background:var(--panel3);gap:1px}
.tri b{display:block;height:100%;transition:width .5s}
.legend{display:flex;justify-content:space-between;font-size:11px;margin-top:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:70px;position:relative;overflow:hidden}
.act:hover:not(:disabled){border-color:var(--acc2);background:#20262D}
.act .ic{color:var(--acc);height:18px}
.act .nm{font-weight:600;font-size:13.5px}
.act .ds{font-size:12px;color:var(--mute)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act.done{border-color:rgba(50,164,103,.45)}.act.done .ic{color:var(--green)}.act.done .nm::after{content:" ✓";color:var(--green)}
.act.go{border-color:var(--amber);opacity:1}.act.go .ic{color:var(--amber)}
.act .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--amber);width:0}
.wide{grid-column:1/-1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv>span:nth-child(odd){color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding-top:2px}
.src{font:11px var(--mono);color:var(--dim);display:block;margin-top:2px}
.flag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:2px}
.flag.bad{background:rgba(205,66,70,.25);color:#FA999C}.flag.ok{background:rgba(35,133,81,.25);color:#72CA9B}.flag.warn{background:rgba(200,118,25,.25);color:#FBB360}.flag.unk{background:rgba(143,153,168,.2);color:var(--mute)}.flag.info{background:rgba(45,114,210,.25);color:#8ABBFF}
.ev{border-left:2px solid var(--line);padding:3px 0 3px 10px;margin-top:8px}
.ev:first-of-type{margin-top:0}
.ev b{display:block;font-weight:600;font-size:13px}.ev span{font-size:13px;color:var(--mute)}
.pcard{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:8px 10px;text-align:left;width:100%}
.pcard:hover{border-color:var(--acc2)}
.av{width:40px;height:40px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--panel3);grid-row:1/3;font-size:13px}
.pcard .nm{font-weight:600}
.pcard .mt{grid-row:1/3;font:600 12px var(--mono);text-align:right}
.audit div{font:11.5px/1.5 var(--mono);padding:3px 0;border-top:1px solid var(--line2);color:var(--mute)}
.audit div:first-child{border-top:0}
.audit div.no{color:#FA999C}
svg.graph{width:100%;display:block;background:#161B21;border:1px solid var(--line2);border-radius:2px}
svg.graph text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;pointer-events:none}
/* dialogs */
.modalbg{position:fixed;inset:0;background:rgba(17,20,24,.7);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:4px 4px 0 0;max-width:520px;width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 0 0 1px rgba(17,20,24,.4),0 4px 8px rgba(17,20,24,.4),0 18px 46px 6px rgba(17,20,24,.4);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:761px){.modalbg{align-items:center}.sheet{border-radius:4px}}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sheet p{margin:8px 0}
.row{display:flex;gap:6px;margin-top:14px}
.btn{flex:1;min-height:40px;background:var(--panel3);border:0;border-radius:3px;padding:10px 12px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(17,20,24,.2),0 1px 2px rgba(17,20,24,.2)}
.btn:hover:not(:disabled){background:#383E47}
.btn.pri{background:var(--acc2);color:#fff}.btn.pri:hover:not(:disabled){background:#215DB0}
.btn.red{background:transparent;box-shadow:inset 0 0 0 1px rgba(231,106,110,.6);color:#FA999C}
.btn.grn{background:transparent;box-shadow:inset 0 0 0 1px rgba(50,164,103,.7);color:#72CA9B}
.btn:disabled{opacity:.45;cursor:not-allowed}
.choice{display:block;width:100%;text-align:left;margin-top:6px;background:var(--panel2)}
.choice b{display:inline-flex;align-items:center;gap:6px}
.choice small{display:block;font-weight:400;color:var(--mute);margin-top:2px}
.choice.on{box-shadow:inset 0 0 0 2px var(--acc);background:rgba(45,114,210,.15)}
.alert{border-left:3px solid var(--red);border-radius:2px;padding:10px 12px;background:rgba(205,66,70,.15);margin-bottom:10px}
.alert b{color:#FA999C;letter-spacing:.08em;font:700 12px var(--mono);display:flex;gap:6px;align-items:center;margin-bottom:4px}
.steps{padding-left:0;margin:6px 0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line2);color:var(--mute);font-size:13.5px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);font:600 11px var(--mono);flex:none;width:20px;height:20px;border-radius:2px;background:var(--panel3);color:var(--ink);display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--ink)}
/* ID card */
.idc{border-radius:3px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.idc .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font:700 10.5px var(--mono);letter-spacing:.12em;color:#fff}
.idc .bd2{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:10px 12px}
.idc .ph{width:80px;height:100px;border-radius:2px;background:var(--panel3);position:relative;overflow:hidden;border:1px solid var(--line)}
.idc .ph svg{position:absolute;inset:0;width:100%;height:100%}
.idc .f{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.idc .v{font-weight:600;font-size:14px;margin-bottom:4px}
.idc .mrz{font:600 11px var(--mono);color:var(--mute);padding:6px 12px 8px;letter-spacing:.06em;border-top:1px dashed var(--line);word-break:break-all;background:#20262D}
.match{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.match i{flex:1;height:6px;background:var(--panel3);border-radius:1px;overflow:hidden}
.match i b{display:block;height:100%}
.match>b{font-family:var(--mono);color:var(--ink)}
.rec{border:1px solid var(--line2);border-radius:3px;padding:10px;margin-top:10px;background:var(--panel)}
.rec.locked{border:1px dashed var(--line);text-align:center;color:var(--mute);background:repeating-linear-gradient(135deg,#1C2127 0 8px,#20262D 8px 16px)}
.rec.locked b{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--mono);letter-spacing:.1em;color:#FBB360}
.rec .ri{border-top:1px solid var(--line2);padding:6px 0;font-size:13.5px}
.rec .ri:first-of-type{border-top:0}
.dots{display:flex;gap:4px;justify-content:center;margin-top:10px}
.dots i{width:14px;height:3px;border-radius:1px;background:var(--line)}.dots i.on{background:var(--acc)}
/* title / end */
.title{min-height:100vh;display:flex;flex-direction:column}
.title .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;background-color:var(--bg);background-image:linear-gradient(rgba(56,62,71,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(56,62,71,.25) 1px,transparent 1px);background-size:32px 32px}
.box{max-width:480px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 18px 46px 6px rgba(17,20,24,.5)}
.box .bh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line2);font-weight:700;letter-spacing:.06em;font-size:13px}
.box .bb{padding:16px}
.title h1{font-size:28px;font-weight:600;letter-spacing:.02em;margin:2px 0 10px}
.title p{margin:10px 0;color:var(--mute)}
.title p b{color:var(--ink)}
.seedrow{display:flex;gap:6px;margin-top:16px}
.seedrow label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600;margin-top:14px}
.seedrow input{flex:1;min-width:0;background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:3px;padding:10px;color:var(--ink);font:600 14px var(--mono)}
.seedrow input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
.end{max-width:620px;margin:0 auto;padding:14px 12px 40px;display:flex;flex-direction:column;gap:8px}
.hero{border-radius:3px;padding:16px;border:1px solid var(--line2);border-left:4px solid var(--line);background:var(--panel)}
.hero.good{border-left-color:var(--green)}.hero.bad{border-left-color:var(--red)}
.hero h1{font-size:21px;font-weight:600;margin:4px 0 8px}
.hero .meta{font:600 11px var(--mono);letter-spacing:.08em;color:var(--dim)}
.grade{font:700 40px var(--mono);float:right;margin-left:10px;line-height:1;padding:6px 10px;border-radius:3px;background:var(--panel2)}
.sc div{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid var(--line2)}
.sc div b{font-family:var(--mono)}
.sc div:first-child{border-top:0}
/* career / meta */
.prof{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;margin:12px 0}
.prof .rk{font-weight:700}.prof .xp{flex:1;min-width:0}
.bar{height:6px;background:var(--panel3);border-radius:1px;overflow:hidden;margin-top:5px}.bar b{display:block;height:100%;background:var(--acc);transition:width .9s ease-out}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.lv{background:var(--panel2);border:0;border-radius:2px;padding:7px 0;font:700 13px var(--mono);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line2)}
.lv.on{background:var(--acc2);color:#fff;box-shadow:none}.lv:disabled{opacity:.45;cursor:not-allowed}
.rule{font-size:12.5px;color:var(--mute);margin-top:6px;min-height:18px}
.daily{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:3px;background:var(--panel2);margin-top:12px}
.daily .dt{flex:1}.daily .dt b{display:block}
.cal{display:flex;gap:3px;margin-top:6px}.cal i{flex:1;font:700 11px/22px var(--mono);text-align:center;border-radius:2px;background:var(--panel3);color:var(--dim);font-style:normal}
.cal i.g{background:rgba(35,133,81,.3);color:#72CA9B}.cal i.b{background:rgba(205,66,70,.25);color:#FA999C}
.tiny{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tiny .flag{font-size:10px}
.cf{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cf div{background:var(--panel2);border-radius:2px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mute);border:1px solid transparent}
.cf div b{display:block;font:700 20px var(--mono);color:var(--ink)}
.cf div.you{border-color:var(--acc)}.cf div.best b{color:#72CA9B}
.ach{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2);font-size:13px}
.ach:first-child{border-top:0}.ach svg{color:var(--amber)}
.ach.new{color:#FBB360}
.share{width:100%;min-height:64px;background:var(--bg);color:var(--ink);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:3px;font:12px var(--mono);padding:8px;margin-top:8px;resize:none}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}55%{transform:scale(1.25,.85)}75%{transform:scale(.92,1.08)}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px) rotate(-.6deg)}40%{transform:translate(5px,-2px) rotate(.5deg)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.fx .grade{animation:pop .6s .35s both cubic-bezier(.3,1.4,.5,1)}
.fx .hero.bad{animation:shake .45s .2s both}
.fx .end>.card{animation:rise .35s both}
.fx .end>.card:nth-child(2){animation-delay:.5s}.fx .end>.card:nth-child(3){animation-delay:.6s}.fx .end>.card:nth-child(4){animation-delay:.7s}.fx .end>.card:nth-child(5){animation-delay:.8s}
@media (prefers-reduced-motion:reduce){.fx *{animation:none!important}.bar b{transition:none}}
@media(max-width:760px){
 .main{display:block;height:auto}
 .brand .crumb{display:none}
 .mapcol{border-right:0;display:block;position:sticky;top:var(--hdr);z-index:4}
 svg.map{height:auto;aspect-ratio:900/470}
 .ticker{padding:5px 10px;font-size:11.5px;min-height:0}
 .panel{display:block}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;padding-bottom:env(safe-area-inset-bottom)}
 .body{overflow:visible;padding-bottom:80px}
}

/* ================= HUD / glass layer (v8) ================= */
:root{
 --bg:#060B10;--panel:rgba(14,24,33,.62);--panel2:rgba(22,36,48,.55);--panel3:rgba(60,90,110,.28);
 --line:rgba(110,200,240,.22);--line2:rgba(110,200,240,.13);
 --ink:#EAF6FB;--mute:#9DB3C2;--dim:#6B8292;
 --acc:#3DD6F5;--acc2:#0E8FB5;--green:#2FD18B;--amber:#F5B544;--red:#FF6B7A;--violet:#A78BFA;
 --glass:blur(14px) saturate(150%);--glow:0 0 0 1px rgba(61,214,245,.45),0 0 18px rgba(61,214,245,.22);
}
html,body{background:var(--bg)}
body{background-image:radial-gradient(1200px 600px at 70% -10%,rgba(61,214,245,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(167,139,250,.08),transparent 60%);background-attachment:fixed}
.ok{color:#5FE3A8}.no{color:#FF8A96}.wn{color:#F8C76A}
/* header */
.classbar{background:linear-gradient(90deg,rgba(20,120,80,.75),rgba(20,150,100,.85),rgba(20,120,80,.75));color:#D8FFEC;text-shadow:0 0 8px rgba(80,255,170,.5)}
.top{background:rgba(8,16,24,.72);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:0 1px 0 var(--line2)}
.brand span:first-of-type{letter-spacing:.22em;text-shadow:0 0 12px rgba(61,214,245,.45)}
.clock{color:var(--acc);text-shadow:0 0 10px rgba(61,214,245,.55)}
.ib:hover{background:rgba(61,214,245,.12)}
.ib.on{background:rgba(61,214,245,.18);color:var(--acc);box-shadow:var(--glow)}
.flow{background:rgba(8,16,24,.6);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--line2)}

// ---------- career (meta-progression, stored apart from the case) ----------
const CAREER = 'lattice-career-v1';

let CR = blankCareer(), sessionCases = 0, newAch = [];

// Clearance ladder (Slay the Spire "Ascension" pattern): each level adds one rule and stacks.
const LEVELS = [null,
  {rule:'Standard watch. Lattice shows its assessment.'},
  {rule:'+ The storm front moves 15% faster.'},
  {rule:'+ Every analyst task takes 1 minute longer.'},
  {rule:'+ No Lattice assessment: you weigh the evidence yourself.'},
  {rule:'+ No pause button. The clock never stops.'}];

const GRADE_MIN = {A:85, B:70, C:50, D:30};
const XPG = {A:100, B:60, C:35, D:15, F:5};
const lvlOf = xp => Math.floor(Math.pow(xp/200, 1/1.4)) + 1;           // cum(L) = 200 × (L-1)^1.4
const xpFor = L => Math.round(200 * Math.pow(L-1, 1.4));
const RANKS = [[1,'Cadet'],[2,'Watch Officer'],[4,'Analyst'],[6,'Senior Analyst'],[9,'Inspector'],[13,'Commodore']];
const rankOf = L => RANKS.filter(r => L >= r[0]).pop()[1];
const ACH = {
  first:  ['First watch', 'Finish a case.'],
  all3:   ['Seen it all', 'Solve a distress, a smuggling and a research case.'],
  nobody: ['Nobody left behind', 'Rescue every person on board.'],
  book:   ['By the book', 'Get an A with records opened only by logged purpose.'],
  light:  ['Not every dark ship', 'Let an innocent research ship pass.'],
  notthem:['Not them', 'Reject every wrong face match in a case.'],
  follow: ['Follow the boat', 'Let smugglers lead police to the beach.'],
  daily:  ['Daily watch', 'Finish a daily case.'],
  lvl5:   ['Clearance 5', 'Unlock the top clearance.'],
  outs:   ['Case archive', 'See all 8 possible outcomes.'],

const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dailyNo = day => Math.round((Date.parse(day) - Date.parse('2026-01-01')) / 864e5) + 1;
function recordCase(G){
  if (G.recorded) return; G.recorded = true;
  const sc = score(G), o = OUT[G.res.kind], before = lvlOf(CR.xp), lvlBefore = CR.lvlMax;
  const gain = Math.round(XPG[sc.grade] * (1 + 0.1*(G.lvl-1))) + (CR.bests[G.truth] ? 0 : 50);
  CR.xp += gain; CR.cases++; sessionCases++;
  const order = 'ABCDF';
  if (!CR.bests[G.truth] || order.indexOf(sc.grade) < order.indexOf(CR.bests[G.truth])) CR.bests[G.truth] = sc.grade;
  CR.outs[G.res.kind] = (CR.outs[G.res.kind] || 0) + 1;
  CR.tel.dec[G.decision || 'none'] = (CR.tel.dec[G.decision || 'none'] || 0) + 1;
  CR.tel.grade[sc.grade] = (CR.tel.grade[sc.grade] || 0) + 1;
  if (G.lvl === CR.lvlMax && G.lvl < 5 && 'AB'.includes(sc.grade)) CR.lvlMax++;
  newAch = [];
  const give = id => { if (!CR.ach[id]){ CR.ach[id] = today(); newAch.push(id); } };
  recordDaily(G, sc, G.decision ? PAY[G.decision][G.truth] : 0, give);
  if (sc.needle && sc.grade === 'A') give('needle');
  give('first');
  if (['D','S','L'].every(T => CR.bests[T] && CR.bests[T] !== 'F')) give('all3');

  if (G.res.kind === 'clear') give('light');

function usedTools(G){
  const u = []; if (G.done.track) u.push('🛰️'); if (G.done.hail) u.push('📻'); if (G.done.registry) u.push('🔍');
  if (G.graph.length > 1) u.push('🕸️'); if (G.done.drone) u.push('🛩️'); if (G.done.face) u.push('🪪'); if (G.unlocked) u.push(G.override ? '⚠️' : '🔓');
  return u.join('');
}
// ---- Daily brief: one shared case a day, rotating through all six operations ----
const DAILY_ROT = ['border','ridge','lantern','bellwether','ledger','skyglass'];
const dailyOp = day => DAILY_ROT[((dailyNo(day) % 6) + 6) % 6];
const opTitle = k => k === 'border' ? 'Border Watch' : OPS[k].name;

function streak(){ const d = new Date(); if (!CR.daily[dayKey(d)]) d.setDate(d.getDate()-1); let n = 0; while (CR.daily[dayKey(d)]){ n++; d.setDate(d.getDate()-1); } return n; }
function untilTomorrow(){ const n = new Date(), t = new Date(n); t.setHours(24,0,0,0); const x = Math.max(0, Math.floor((t - n)/1000)); return [x/3600|0, (x/60|0)%60, x%60].map(v => String(v).padStart(2,'0')).join(':'); }
// ---- Uplink: the score lifts a signal toward geostationary orbit (log scale, real altitudes) ----
const GEO = 35786;
const altOf = sc => sc <= 0 ? 0 : Math.round(Math.pow(GEO, sc/100));
const scoreFor = km => Math.ceil(100 * Math.log(km) / Math.log(GEO));
const fmtKm = km => km.toLocaleString('en-US') + ' km';
const MARKS = [[9,'Everest','Higher than Everest (8.8 km)'],[21,'spy-plane ceiling','Spy-plane ceiling: high-altitude reconnaissance jets'],[100,'Kármán line','Kármán line: space begins'],
  [408,'ISS','The space station, and most imaging satellites'],[2000,'low orbit','Edge of low Earth orbit'],[20200,'GPS','GPS satellites'],[GEO,'geostationary','Geostationary orbit: a perfect brief']];
// ---- Signal tiers: six names, the top one only for calling the unlikely answer right ----
const TIERS = [[0,'Static'],[30,'Chatter'],[50,'Lead'],[70,'Signal'],[85,'Clear signal']];

function againstOdds(prior, truth, pay){ const v = Object.values(prior), mn = Math.min(...v), mx = Math.max(...v); return pay === 100 && prior[truth] <= mn + 0.01 && mx - prior[truth] >= 0.05; }
function cluePattern(G){
  const keys = G.op ? OPK : HK, ti = keys.indexOf(G.truth);
  return G.findings.filter(f => f.w).map(f => f.mis ? '🟥' : f.w.indexOf(Math.max(...f.w)) === ti ? '🟩' : '🟨').join('');
}
function recordDaily(G, sc, pay, give){
  if (!G.daily || CR.daily[G.daily]) return;
  CR.daily[G.daily] = {g:sc.grade, d:G.decision, op:G.op || 'border', s:sc.s, tier:tierOf(sc), pat:cluePattern(G), res: pay >= 80 ? '✅' : pay >= 50 ? '➖' : '❌',
    used: G.op ? '' : usedTools(G), t:hhmm(G.decidedAt ?? G.res.t), lvl:G.lvl};
  const n = streak(); CR.bestStreak = Math.max(CR.bestStreak || 0, n);
  give('daily'); if (n >= 3) give('streak3');
}

  const r = CR.daily[day]; if (!r) return '';

  const km = altOf(r.s), top = MARKS.filter(m => km >= m[0]).pop(), n = streak();
  return `LATTICE Daily Brief #${dailyNo(day)} · ${opTitle(r.op)}\nGrade ${r.g} · ${r.tier}${n > 1 ? ' · 🔥' + n : ''}\n${r.pat || '·'} → ${r.res}\nUplink ${fmtKm(km)}${top ? ' · past ' + top[1] : ''}`;
}
function uplinkCard(G, sc){
  const km = altOf(sc.s), top = MARKS.filter(m => km >= m[0]).pop(), next = MARKS.find(m => km < m[0]);
  const pos = k => k <= 1 ? 0 : Math.log(k) / Math.log(GEO) * 100, me = pos(km);
  return `<div class="card upl"><div class="lbl"><span>Uplink</span><span class="tier">${tierOf(sc)}</span></div>
   <div class="upw" aria-hidden="true"><div class="ume" style="--to:${me.toFixed(1)}%"><b>${fmtKm(km)}</b></div>
    ${MARKS.map(m => `<div class="um ${km >= m[0] ? 'on' : ''}" style="bottom:${pos(m[0]).toFixed(1)}%;--d:${(0.3 + 1.6 * pos(m[0]) / Math.max(me, 1)).toFixed(2)}s"><span>${fmtKm(m[0])}</span><em>${m[2]}</em></div>`).join('')}</div>
   <p class="sm">Your score lifts the uplink: <b>${fmtKm(km)}</b>. ${top ? 'Highest landmark passed: ' + top[1] + '.' : 'Still on the ground.'}</p>
   ${next ? `<p class="mute sm">Next: ${next[1]} at ${fmtKm(next[0])}, ${scoreFor(next[0]) - sc.s} more point${scoreFor(next[0]) - sc.s === 1 ? '' : 's'}.</p>` : ''}
   ${sc.needle ? '<p class="ok sm">Against the odds: the base rate pointed elsewhere, and you followed the evidence.</p>' : ''}
   ${G.daily ? `<p class="sm" style="margin-top:6px">Daily streak: <b>${streak()} day${streak() === 1 ? '' : 's'}</b> · best ${CR.bestStreak || streak()} · next brief in <span class="cd">${untilTomorrow()}</span></p>` : ''}</div>`;
}

function tone(f, d=0.1, type='sine', gain=0.12, delay=0){
  if (!CR.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

  } catch(e){}
}

    C.vessel = {name:hull, type:'Fishing boat · 11 m', flag:'Varnholm (licence lapsed)', mmsi:'none', owner:'Lund Fishing AS', port:'Saltvik (abroad), 9 days ago'};
    C.track = ['Track matches fishing boat '+hull, 'Its AIS went silent 9 h ago, 30 km west. The radar contact has drifted here since.', [2,0.8,0.9]];

      {id:'v', label:hull, kind:'vessel', parent:null},
      {id:'c', label:'Lund Fishing AS', kind:'company', parent:'v', text:'Registered owner of '+hull+'. Director: Petar Lund.', w:[1,1.1,1]},

      {id:'p', label:'Petar Lund', kind:'person', parent:'c', text:'Director, 52. Sold the boat abroad last year. Fined for illegal fishing in 2014.', w:[0.9,1.4,1], flag:'warn'}];

function graphSVG(G){

  const maxD = Math.max(1, ...C.graph.map(depth)), dx = 270 / maxD;
  const xy = id => { const p = pos[id], cnt = cols[p.d]; return {x:50 + p.d*dx, y: 30 + (cnt===1 ? 60 : p.i * (120/(cnt-1)))}; };

  let lines = '', nodes = '';
  for (const n of shown){
    const a = xy(n.id);
    if (n.parent && pos[n.parent]){ const b = xy(n.parent); lines += `<line x1="${b.x}" y1="${b.y}" x2="${a.x}" y2="${a.y}" stroke="#404854" stroke-width="1.5"/>`; }
    const more = C.graph.some(x => x.parent === n.id && !G.graph.includes(x.id));
    const ring = n.flag === 'bad' ? '#E76A6E' : n.flag === 'warn' ? '#EC9A3C' : n.flag === 'ok' ? '#32A467' : '#4C90F0';
    nodes += `<g data-act="node" data-id="${n.id}" style="cursor:pointer"><circle cx="${a.x}" cy="${a.y}" r="20" fill="#252A31" stroke="${ring}" stroke-width="2"/>
      <svg pointer-events="none" x="${a.x-9}" y="${a.y-9}" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#F6F7F9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[ICON[n.kind]]}</svg>
      <text x="${a.x}" y="${a.y+38}" text-anchor="middle" font-size="11" fill="#ABB3BF">${esc(n.label.length > 16 ? n.label.slice(0,15)+'…' : n.label)}</text>
      ${more ? `<rect x="${a.x+9}" y="${a.y-25}" width="16" height="16" rx="3" fill="#3DD6F5"/><text x="${a.x+17}" y="${a.y-13}" text-anchor="middle" font-size="13" font-weight="800" fill="#04131A">+</text>` : ''}</g>`;
  }
  return `<svg class="graph" viewBox="0 0 370 190">${lines}${nodes}</svg>`;
}

const OUT = {
  saved:{g:true, h:'Everyone was rescued'}, partial:{g:false, h:'Only some people were rescued'}, lost:{g:false, h:'The boat sank. Nobody was saved'},
  intercepted:{g:true, h:'Smugglers caught at sea'}, followed:{g:true, h:'Smugglers arrested on the beach'}, landed:{g:false, h:'The smugglers got away'},
  clear:{g:true, h:'The research ship left safely'}, incident:{g:false, h:'You boarded an innocent research ship'}

function judgement(G, d){ const p = probs(G); return HK.reduce((a,T) => a + p[T]*PAY[d][T], 0); }
function missedClue(G){
  // the single most telling clue the player never collected (honest "what you missed")
  const C = G.sc.C, ti = HK.indexOf(G.truth), have = new Set(G.findings.map(f => f.key)), cand = [];
  const add = (key, tool, title, w) => { if (!have.has(key) && w) cand.push({tool, title, r: w[ti] / Math.max(...w.filter((_,i)=>i!==ti))}); };
  add('track', 'Replay track', C.track[0], C.track[2]); add('hail', 'Radio call', hailResult(G)[0], hailResult(G)[2]);
  add('registry', 'Registry check', C.registry[0], C.registry[2]); add('drone', 'Drone', droneResult(G)[0], droneResult(G)[2]);
  C.graph.forEach(n => n.w && add('g-'+n.id, 'Search around', n.label+': '+n.text, n.w));
  C.people.forEach((p,i) => !p.crowd && p.same && add('rec-'+i, 'Police records', p.n+': '+p.tag, p.w));
  return cand.filter(c => c.r > 1.5).sort((a,b) => b.r - a.r)[0] || null;
}
function score(G){
  const L = []; let s = {saved:45, partial:20, lost:0, intercepted:45, followed:35, landed:0, clear:45, incident:5}[G.res.kind];
  L.push(['Outcome', s]);
  const J = G.decision ? (G.judge ?? judgement(G, G.decision)) : 0, callPts = Math.round(J * 0.2);
  s += callPts; L.push([J >= 70 ? 'Sound call for the evidence you had' : J >= 45 ? 'Shaky call for the evidence you had' : 'The evidence didn’t support this call', callPts]);
  let idp = 0; G.sc.C.people.forEach((p,i) => { if (p.crowd || !G.ids[i]) return; idp += ((G.ids[i]==='yes') === p.same) ? 5 : -8; });
  s += idp; L.push(['Identity matches resolved', idp]);
  const acc = G.override ? -10 : G.unlocked ? 10 : 0; s += acc; L.push([G.override ? 'Records opened by override' : G.unlocked ? 'Records opened with a logged purpose' : 'Records never opened', acc]);
  const ev = G.findings.length >= 3 ? 10 : 0; s += ev; L.push([ev ? 'Gathered evidence before acting' : 'Acted on little evidence', ev]);
  if (G.decision === 'board'){ const b = G.basisOK ? 5 : -15; s += b; L.push([G.basisOK ? 'Boarding had a valid legal basis' : 'Boarding had no valid legal basis', b]); }
  const needle = !!G.decision && againstOdds({D:.3, S:.4, L:.3}, G.truth, PAY[G.decision][G.truth]);
  if (needle){ s += 8; L.push(['Against the odds: the less likely answer, called right', 8]); }
  s = clamp(s, 0, 100);
  return {s, L, needle, grade: s >= 85 ? 'A' : s >= 70 ? 'B' : s >= 50 ? 'C' : s >= 30 ? 'D' : 'F'};
}

   <div class="card"><div class="lbl"><span>The lesson</span></div><p>${lesson}</p></div>
   <div class="card"><div class="lbl"><span>Audit log (what oversight sees)</span></div><div class="audit">${G.audit.map(a => `<div class="${/OVERRIDE/.test(a.m)?'no':''}">${hhmm(a.t)} ${esc(a.m)}</div>`).join('')}</div></div>

  </div>`;
}

const OPS_ORDER = ['ridge','lantern','bellwether','ledger','skyglass'];

// ---------- operations engine ----------
const OPN = () => OPS[GS.op];
function fill(s, G){ const V = G.V; return String(s).replace(/\{(S2|S|A|P|CO|DL)\}/g, (m,k) => k === 'DL' ? G.deadline : V[k]); }
function fillE(s, G){ return fill(esc(s), G); }
function opFresh(op, seed, lvl=1, tut=false){
  const O = OPS[op], r = mulberry(hash(op + ':' + seed)), pick = a => a[Math.floor(r()*a.length)];
  let truth = O.tutT;
  if (!tut){ const x = r(); let acc = 0; truth = 'C'; for (const k of OPK){ acc += O.prior[k]; if (x < acc){ truth = k; break; } } }
  const nm = () => pick(FIRST) + ' ' + pick(LAST);
  const V = {S:nm(), S2:nm(), A:pick(FIRST) + ' ' + pick(['Lund','Rask','Veid','Holm']), P:pick(O.places), CO:pick(['Nordhav','Brask','Vellum','Tarn','Ostro'])};
  while (V.S2 === V.S) V.S2 = nm();
  const mis = {};
  for (const t of O.tasks) if (!tut && t.r && r() > t.rel) mis[t.id] = pick(OPK.filter(k => k !== truth));
  const cloud = !!O.cloud && (tut ? !!O.tutCloud : r() < O.cloud.p);
  let dl = tut ? O.deadline + 20 : Math.round(O.deadline * (0.92 + r()*0.16));
  if (lvl >= 2 && !tut) dl = Math.round(dl * 0.87);
  return {v:5, op, seed, phase:'play', t:0, speed:1, paused:true, truth, lvl:tut ? 1 : lvl, daily:null, tut, V, mis, cloud, deadline:dl,
    done:{}, findings:[], ticker:[{t:0, m:O.code+' opened: '+O.kind.toLowerCase()+', deadline in '+dl+' min'}], audit:[], tab:'look', badge:null, busy:null, logged:false, override:false,
    decision:null, closed:false, res:null, modal:{type:tut ? 'otut' : 'obrief', first:true}, tstep:0};
}
function opProbs(G){
  const O = OPS[G.op], p = {...O.prior};
  for (const f of G.findings) if (f.w) OPK.forEach((k,i) => p[k] *= f.w[i]);
  const s = OPK.reduce((a,k) => a + p[k], 0); OPK.forEach(k => p[k] /= s); return p;
}
const opBest = p => OPK.reduce((a,b) => p[b] > p[a] ? b : a, 'A');
function opTaskMin(t){ return t.min + (GS.lvl >= 3 ? 1 : 0); }
function opAvail(G, t){
  if (G.closed || G.done[t.id]) return false;
  if (t.at && G.t < t.at) return false;
  if (t.needs && !t.needs.some(n => G.done[n])) return false;
  return true;
}
function opResult(G, t){
  if (t.fact) return {title:fill(t.fact, G), text:'', w:null};
  if (t.cloud && G.cloud) return {title:'Clouds cover the target', text:'This image is unusable. Other sensors may see through cloud.', w:[1,1,1], cloudy:true};
  const k = G.mis[t.id] || G.truth, x = t.r[k];
  let w = x[2]; if (G.mis[t.id]) w = w.map(v => +Math.sqrt(v).toFixed(2));
  return {title:fill(x[0], G), text:fill(x[1], G), w, k, mis:!!G.mis[t.id]};
}
function opBegin(G, t, extra=0){
  G.busy = {id:t.id, start:G.t, end:+(G.t + opTaskMin(t) + extra).toFixed(2), label:t.nm};
  audit(t.nm + (t.restricted ? ' · restricted data' : ''));
}
function opFinish(b){
  const G = GS, O = OPS[G.op], t = O.tasks.find(x => x.id === b.id);
  G.done[t.id] = true; tone(880,.07,'triangle',.06);
  const r = opResult(G, t);
  G.findings.unshift({key:t.id, t:G.t, title:r.title, text:r.text, w:r.w, src:t.src, img:t.img && !r.cloudy ? t.img : (r.cloudy ? 'cloud' : null), k:r.k, mis:r.mis});
  tick(r.title); G.badge = 'case';
  if (t.img) G.modal = {type:'oimg', id:t.id};
  const st = G.tut && O.tut[G.tstep]; if (st && st.t === t.id) G.tstep++;
  if (G.tut && O.tut[G.tstep] && O.tut[G.tstep].t === 'sar' && !G.cloud) G.tstep++;
  dirty = true;
}
function opStep(dt){
  const G = GS; G.t = +(G.t + dt).toFixed(2);
  if (G.busy && G.t >= G.busy.end - 1e-6){ const b = G.busy; G.busy = null; opFinish(b); }
  if (!G.closed && G.t >= G.deadline){
    G.closed = true; G.decision = 'timeout'; G.decidedAt = G.t; G.judge = 0; G.busy = null;
    audit('DEADLINE PASSED · no decision'); tick('Time is up: '+OPS[G.op].dlTxt+'.');
  }
  if (G.closed && !G.res && G.t >= G.decidedAt + 6) G.res = {t:G.t};
  if (G.res && G.t >= G.res.t + 3){ G.phase = 'end'; G.modal = null; }
}
function opJudge(G, d){ const p = opProbs(G), D = OPS[G.op].dec[d]; return OPK.reduce((a,T) => a + p[T]*D.pay[T], 0); }
function opPay(G){ const O = OPS[G.op]; return G.decision === 'timeout' ? O.timeout[G.truth] : O.dec[G.decision].pay[G.truth]; }
function opScore(G){
  const O = OPS[G.op], L = [], pay = opPay(G);
  let s = Math.round(pay * 0.45); L.push([pay >= 80 ? 'Outcome: the right call' : pay >= 50 ? 'Outcome: partly right' : 'Outcome: it went wrong', s]);
  if (G.decision === 'timeout'){ L.push(['Ran out of time: no decision', -10]); s -= 10; }
  else {
    const J = G.judge ?? opJudge(G, G.decision), cp = Math.round(J * 0.2); s += cp;
    L.push([J >= 70 ? 'Sound call for the evidence you had' : J >= 45 ? 'Shaky call for the evidence you had' : 'The evidence didn’t support this call', cp]);
    const need = O.dec[G.decision].need;
    if (need){ const ok = !!G.done[need]; const v = ok ? 5 : -15; s += v; L.push([ok ? 'Acted with the legal paperwork in place' : 'Acted without a '+O.tasks.find(t => t.id === need).nm.toLowerCase(), v]); }
    if (G.decidedAt <= G.deadline * 0.75){ s += 5; L.push(['Decided with time to spare', 5]); }
  }
  if (O.tasks.some(t => t.restricted)){ const a = G.override ? -10 : G.logged ? 10 : 0; s += a; L.push([G.override ? 'Restricted data opened by override' : G.logged ? 'Restricted data opened with a logged purpose' : 'Restricted data never opened', a]); }
  const ev = G.findings.filter(f => f.w).length >= 3 ? 10 : 0; s += ev; L.push([ev ? 'Gathered evidence before acting' : 'Acted on little evidence', ev]);
  const needle = G.decision !== 'timeout' && againstOdds(O.prior, G.truth, pay);
  if (needle){ s += 8; L.push(['Against the odds: the less likely answer, called right', 8]); }
  s = clamp(s, 0, 100);
  return {s, L, needle, grade:letter(s), good: pay >= 80};
}
function recordOp(G){
  if (G.recorded) return; G.recorded = true;
  const sc = opScore(G), before = lvlOf(CR.xp), lvlBefore = CR.lvlMax;
  CR.ob = CR.ob || {};
  const gain = Math.round(XPG[sc.grade] * (1 + 0.1*(G.lvl-1)) * (G.tut ? 0.5 : 1)) + (CR.ob[G.op] ? 0 : 50);
  CR.xp += gain; CR.cases++; sessionCases++;
  const order = 'ABCDF';
  if (!CR.ob[G.op] || order.indexOf(sc.grade) < order.indexOf(CR.ob[G.op])) CR.ob[G.op] = sc.grade;
  CR.tel.dec[G.op+':'+G.decision] = (CR.tel.dec[G.op+':'+G.decision] || 0) + 1;
  CR.tel.grade[sc.grade] = (CR.tel.grade[sc.grade] || 0) + 1;
  if (!G.tut && G.lvl === CR.lvlMax && G.lvl < 5 && 'AB'.includes(sc.grade)) CR.lvlMax++;
  newAch = [];
  const give = id => { if (!CR.ach[id]){ CR.ach[id] = today(); newAch.push(id); } };
  give('first');
  if (G.tut){ give('trained'); CR.tut = CR.tut || {}; CR.tut[G.op] = 1; }
  if (OPS_ORDER.every(k => CR.ob[k])) give('ops');
  if (!G.tut){ recordDaily(G, sc, opPay(G), give); if (sc.needle && sc.grade === 'A') give('needle'); }
  if (CR.lvlMax >= 5) give('lvl5');
  G.meta = {gain, before, after:lvlOf(CR.xp), unlocked: CR.lvlMax > lvlBefore ? CR.lvlMax : 0, ach:newAch.slice(), xpAfter:CR.xp};
  saveCareer(); save();
}

   <div class="clock" id="clock"></div>

function opMapBase(op){
  let g = '';
  for (let x=200; x<1000; x+=100) g += `<line x1="${x}" y1="60" x2="${x}" y2="560"/>`;
  for (let y=100; y<560; y+=100) g += `<line x1="100" y1="${y}" x2="1000" y2="${y}"/>`;
  const T = (x,y,s,c='#7FB6CC',sz=12,a='middle') => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="${sz}" letter-spacing="1.5" fill="${c}">${s}</text>`;
  let b = `<rect x="0" y="0" width="1100" height="620" fill="#07111A"/><g stroke="rgba(61,214,245,.10)">${g}</g>`;
  if (op === 'ridge'){
    for (let i=0;i<7;i++) b += `<ellipse cx="${380+i*12}" cy="${190-i*6}" rx="${210-i*28}" ry="${90-i*12}" fill="none" stroke="rgba(120,200,150,.18)"/><ellipse cx="${560+i*8}" cy="${470-i*4}" rx="${170-i*22}" ry="${60-i*8}" fill="none" stroke="rgba(120,200,150,.16)"/>`;
    b += `<path d="M640,60 L1000,60 L1000,560 L640,560 Z" fill="rgba(36,64,82,.35)"/>`;
    b += `<path d="M120,440 C300,420 420,380 520,340 S700,270 800,250 L1000,230" fill="none" stroke="#5a6b78" stroke-width="5"/><path d="M120,440 C300,420 420,380 520,340 S700,270 800,250 L1000,230" fill="none" stroke="#9fb0bd" stroke-width="1" stroke-dasharray="8 8"/>`;
    b += `<line x1="640" y1="60" x2="640" y2="560" stroke="#F5B544" stroke-opacity=".75" stroke-dasharray="10 8" stroke-width="2"/>`;
    b += T(632,84,'DEMARCATION LINE','#F5B544',13,'end') + T(800,232,'KARVEN PASS','#EAF6FB',13) + T(900,520,'VARNHOLM','#2f5266',20) + T(250,520,'KESTRIA','#2f5266',20) + T(330,300,'ORLA') + `<rect x="324" y="306" width="10" height="10" fill="#AAE5C2"/>`;
  } else if (op === 'lantern' || op === 'bellwether'){
    for (let x=140; x<1000; x+=60) b += `<line x1="${x}" y1="60" x2="${x+20}" y2="560" stroke="#1d2c38" stroke-width="${x%180===140?6:2}"/>`;
    for (let y=90; y<560; y+=55) b += `<line x1="100" y1="${y}" x2="1000" y2="${y-15}" stroke="#1d2c38" stroke-width="${y%165===90?6:2}"/>`;
    b += `<path d="M700,560 C760,470 860,430 1000,400 L1000,560 Z" fill="rgba(36,90,120,.55)" stroke="rgba(61,214,245,.5)"/>`;
    if (op === 'lantern'){
      const S = (x,y,l) => `<rect x="${x-9}" y="${y-9}" width="18" height="18" fill="none" stroke="#EAF6FB" stroke-width="2"/>` + T(x,y-16,l,'#EAF6FB',12);
      b += S(320,190,'KESSEL ST FLATS') + S(560,330,'CENTRAL STATION') + S(860,440,'FERRY TERMINAL');
    } else {
      b += `<rect x="640" y="250" width="200" height="130" rx="6" fill="rgba(245,181,68,.12)" stroke="#F5B544" stroke-width="2"/>` + T(740,320,'FESTIVAL GROUNDS','#F5B544',13) + T(700,242,'NORTH GATE','#EAF6FB',11);
    }
  } else if (op === 'ledger'){
    b += `<path d="M150,140 C220,90 380,110 420,180 C450,260 360,330 250,320 C170,310 120,220 150,140Z" fill="rgba(36,64,82,.55)" stroke="rgba(61,214,245,.45)"/>`;
    b += `<path d="M470,110 C560,70 720,90 800,140 C900,190 960,260 900,300 C820,350 700,330 640,280 C560,240 450,190 470,110Z" fill="rgba(36,64,82,.45)" stroke="rgba(61,214,245,.35)"/>`;
    b += `<ellipse cx="660" cy="430" rx="50" ry="22" fill="rgba(36,64,82,.45)" stroke="rgba(61,214,245,.35)"/>`;
    const C = (x,y,l,c='#7FB6CC') => `<circle cx="${x}" cy="${y}" r="5" fill="${c}"/>` + T(x,y-12,l,c,11);
    b += C(300,240,'VARNHOLM','#EAF6FB') + C(520,170,'OSTREL') + C(860,200,'RED PASS','#FF8A96') + C(760,330,'SOLVAR') + C(660,420,'ISLA BRENT');
  } else if (op === 'skyglass'){
    for (let i=0;i<6;i++) b += `<ellipse cx="600" cy="300" rx="${330-i*45}" ry="${150-i*20}" fill="none" stroke="rgba(200,170,120,.16)"/>`;
    b += `<path d="M120,520 L1000,80" stroke="rgba(167,139,250,.6)" stroke-dasharray="3 7" stroke-width="2"/>` + T(170,470,'SATELLITE GROUND TRACK','#A78BFA',11,'start');
    b += T(600,250,'{P}','#EAF6FB',13);
  }
  return b;
}
function opMarks(G){
  const O = OPS[G.op]; let s = '';
  for (const m of O.map.marks || []){
    if (m.show && !G.done[m.show]) continue;
    const k = (m.show && G.mis[m.show]) || G.truth;
    if (m.kind === 'arc'){ const pts = m.pts[k]; s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#F5B544" stroke-width="2.5" stroke-dasharray="7 5"/>` + pts.slice(1).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="none" stroke="#F5B544" stroke-width="2"/>`).join(''); continue; }
    const pos = Array.isArray(m.pos) ? m.pos : m.pos[k]; if (!pos) continue;
    const [x,y] = pos, lab = fillE(m.label, G);
    if (m.kind === 'ping') s += `<circle cx="${x}" cy="${y}" r="42" fill="rgba(61,214,245,.12)" stroke="#3DD6F5" stroke-dasharray="4 4"/><circle cx="${x}" cy="${y}" r="4" fill="#3DD6F5"/>`;
    else if (m.kind === 'site') s += `<g transform="translate(${x},${y})"><path d="${SYM.unknown}" fill="#F0B726" stroke="#111418" stroke-width="2"/><text y="4" text-anchor="middle" font-size="10" font-weight="800" fill="#111418">?</text></g>`;
    else s += `<g transform="translate(${x},${y})"><rect x="-9" y="-7" width="18" height="14" rx="2" fill="${m.kind==='hot'?'#FF8A96':'#F5B544'}" stroke="#111418" stroke-width="1.5"/></g>`;
    s += `<text x="${x}" y="${y + (m.kind==='ping'?-48:-14)}" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#F8C76A">${lab}</text>`;
  }
  return s;
}
function opMapSVG(G){
  const O = OPS[G.op], tg = O.map.target;
  return `<svg class="map" viewBox="100 60 900 470" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Operation map">
   ${fill(opMapBase(G.op), G)}<g id="omk"></g>
   ${tg ? `<g id="otg"><circle r="20" fill="none" stroke="#FBB360" stroke-width="1.5"><animate attributeName="r" values="10;28;10" dur="2.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".8;0;.8" dur="2.2s" repeatCount="indefinite"/></circle>
     <path d="${SYM.unknown}" fill="${G.op==='skyglass'?'#A78BFA':'#F0B726'}" stroke="#111418" stroke-width="2"/><text y="-24" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#FBD065">${tg.label}</text></g>` : ''}</svg>`;
}
function opTargetPos(G){
  const tg = OPS[G.op].map.target; if (!tg) return null;
  const f = tg.loop ? (G.t % tg.loop) / tg.loop : clamp(G.t / G.deadline, 0, 1), P = tg.pts;
  const seg = f * (P.length - 1), i = Math.min(P.length - 2, Math.floor(seg)), u = seg - i;
  return {x:P[i][0] + (P[i+1][0]-P[i][0])*u, y:P[i][1] + (P[i+1][1]-P[i][1])*u};
}
function opFrame(){
  const G = GS, O = OPN();
  $('#clock').textContent = hhmm(G.t);
  const bpH = I(G.paused ? 'play' : 'pause'); if ($('#bp')._h !== bpH){ $('#bp').innerHTML = bpH; $('#bp')._h = bpH; } $('#bp').classList.toggle('on', G.paused);
  setTxt('#bs', G.speed + '×');
  const p = opTargetPos(G); if (p) $('#otg').setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
  setHTML('#omk', opMarks(G));
  const left = G.deadline - G.t;
  let chips = `<span class="chip ${left < 10 && left > 0 ? 'hot' : ''}">${I('clock',12)} ${left > 0 ? esc(O.dlTxt)+' '+Math.ceil(left)+' min' : 'deadline passed'}</span>`;
  const nx = O.tasks.filter(t => t.at && !G.done[t.id] && G.t < t.at).sort((a,b) => a.at - b.at)[0];
  if (nx) chips += `<span class="chip">${I('sat',12)} ${esc(nx.nm.replace(' pass',''))} in ${Math.ceil(nx.at - G.t)} min</span>`;
  if (G.busy) chips += `<span class="chip busy">${I('clock',12)} ${esc(G.busy.label)}</span>`;
  setHTML('#chips', chips);
  const pg = $('#pg'); if (pg && G.busy) pg.style.width = clamp((G.t-G.busy.start)/(G.busy.end-G.busy.start)*100, 0, 100) + '%';
  if (dirty){ dirty = false; opPanel(); }
}
function opHint(G){
  const O = OPS[G.op];
  if (G.closed) return G.decision === 'timeout' ? 'Time ran out before you decided.' : 'Decision made. Watch the outcome.';
  if (G.tut){ const st = O.tut[G.tstep]; if (st) return `<span class="flag info">Tutorial ${G.tstep+1}/${O.tut.length}</span> ${st.x}`; }
  if (G.busy) return 'Analyst busy: '+esc(G.busy.label)+'…';
  const nx = O.tasks.find(t => opAvail(G, t) && t.r);
  const n = G.findings.filter(f => f.w).length;
  if (n >= 4) return `<b>You have a picture.</b> Decide before the deadline, or keep checking.`;
  if (nx){ const tab = O.tabs.find(x => x[0] === nx.tab); return `<b>Next:</b> ${esc(nx.nm)} <span class="mute">(${tab[2]} tab)</span>${n ? '' : ' · or read the briefing with <b>?</b>'}`; }
  return '<b>Decide:</b> open the Decide tab.';
}
function assessCard(G, p, n, keys, names, cols, base){
  const b = keys.reduce((a,k) => p[k] > p[a] ? k : a, keys[0]);
  if (blind(G)) return `<div class="card"><div class="lbl"><span>Lattice assessment</span><span>${I('lock',12)} clearance 4</span></div><div class="mute sm">Assessment switched off at this clearance. You have ${n} piece${n===1?'':'s'} of evidence in the Case tab: weigh them yourself.</div></div>`;
  const verdict = !n ? `<div class="verdict mute">No evidence yet</div><div class="mute sm">Starting guess from past cases. ${esc(base)} That’s a base rate, not evidence.</div>`
    : `<div class="verdict" style="color:${cols[b]}">${esc(names[b])} · ${Math.round(p[b]*100)}%</div><div class="mute sm">${p[b] < .75 ? 'Not sure yet' : 'Fairly sure'} · ${n} piece${n>1?'s':''} of evidence you collected.</div>`;
  return `<div class="card"><div class="lbl"><span>Lattice assessment</span></div>${verdict}
    <div class="tri">${keys.map(k => `<b style="width:${(p[k]*100).toFixed(1)}%;background:${cols[k]}"></b>`).join('')}</div>
    <div class="legend">${keys.map(k => `<span style="color:${cols[k]}">${esc(names[k])} ${Math.round(p[k]*100)}%</span>`).join('')}</div></div>`;
}
function opPanel(){
  const G = GS, O = OPN(), n = G.findings.filter(f => f.w).length;
  const last = G.ticker[G.ticker.length-1];
  $('#ticker').innerHTML = last ? `<span class="tm">${hhmm(last.t)}</span>${esc(last.m)}` : '';
  const hasR = O.tasks.some(t => t.restricted);
  const fl = [['Alert',true],['Collect',n>=1],['Corroborate',n>=3],['Vet',!hasR || G.logged || G.override],['Decide',!!G.decision]];
  const cur = fl.findIndex(f => !f[1]);
  $('#flow').innerHTML = fl.map((f,j) => `<span class="${f[1] ? 'd' : j===cur ? 'c' : ''}"><b>${f[1] ? '✓' : j+1}</b>${f[0]}</span>`).join('<em>›</em>');
  const tabs = [...O.tabs, ['case','folder','Case'], ['decide','scales','Decide']], tutT = G.tut && O.tut[G.tstep] ? O.tut[G.tstep].t : null;
  const tutTab = tutT === 'decide' ? 'decide' : tutT ? O.tasks.find(t => t.id === tutT).tab : null;
  $('#tabs').innerHTML = tabs.map(t => `<button class="tab ${G.tab===t[0]?'on':''} ${t[0]==='decide'?'dec':''} ${tutTab===t[0]&&G.tab!==t[0]?'pulse':''}" data-act="${t[0]==='decide'?'oask':'tab'}" data-t="${t[0]}" ${t[0]==='decide'&&G.closed?'disabled':''}><span class="ti">${I(t[1],18)}</span>${t[2]}${G.badge===t[0]&&G.tab!==t[0]?'<span class="bd"></span>':''}</button>`).join('');
  let h = `<div class="hint">${I('info')}<span>${opHint(G)}</span></div>`;
  const btn = t => {
    const busy = G.busy && G.busy.id === t.id, wait = t.at && G.t < t.at && !G.done[t.id];
    let ds = fill(t.ds, G); if (wait) ds = 'Next pass in '+Math.ceil(t.at - G.t)+' min'; else if (t.needs && !t.needs.some(x => G.done[x]) && !G.done[t.id]) ds = 'Needs: '+t.needs.map(x => O.tasks.find(y => y.id===x).nm).join(' or ');
    else if (!t.restricted && !wait) ds = ds.includes('min') ? ds : ds + ' · ' + opTaskMin(t) + ' min';
    return `<button class="act ${G.done[t.id]?'done':''} ${busy?'go':''} ${tutT===t.id?'pulse':''}" data-act="otask" data-id="${t.id}" ${(!opAvail(G,t) || G.busy) && !busy ? 'disabled' : ''}><span class="ic">${I(t.restricted && !G.done[t.id] ? 'lock' : t.ic,18)}</span><span class="nm">${esc(t.nm)}</span><span class="ds">${esc(ds)}</span>${busy?'<i class="pg" id="pg"></i>':''}</button>`;
  };
  const tl = O.tasks.filter(t => t.tab === G.tab);
  if (tl.length) h += `<div class="acts">${tl.map(btn).join('')}</div>`;
  if (G.tab === 'people' && O.subject) h += `<div class="card"><div class="lbl"><span>Subject</span><span>${G.logged ? '<span class="ok">access logged</span>' : G.override ? '<span class="no">override</span>' : ''}</span></div><div class="pcard" style="cursor:default"><span class="av">${esc(initials(G.V.S))}</span><span class="nm">${fillE(O.subject, G)}</span><span class="mt"></span><span class="mute sm">Being linked to something is not proof.</span></div></div>`;
  if (G.tab === 'look') h += assessCard(G, opProbs(G), n, OPK, O.hyp, O.col, O.base);
  if (G.tab === 'case'){
    h += assessCard(G, opProbs(G), n, OPK, O.hyp, O.col, O.base);
    h += G.findings.length ? `<div class="card"><div class="lbl"><span>Evidence</span><span>${G.findings.length}</span></div>${G.findings.map(f => `<div class="ev" style="border-color:${f.w ? O.col[opBest({A:f.w[0],B:f.w[1],C:f.w[2]})] : 'var(--line)'}"><b>${esc(f.title)}</b>${f.text ? `<span>${esc(f.text)}</span>` : ''}<span class="src">${hhmm(f.t)} · ${esc(f.src)}${f.img ? ` · <button class="lnk" data-act="oview" data-id="${f.key}">view image</button>` : ''}</span></div>`).join('')}</div>` : '';
    h += `<div class="card"><div class="lbl"><span>Audit log</span><span>every query is recorded</span></div><div class="audit">${G.audit.slice().reverse().map(a => `<div class="${/OVERRIDE/.test(a.m)?'no':''}">${hhmm(a.t)} ${esc(a.m)}</div>`).join('')}</div></div>`;
  }
  if (G.tab === 'decide' && G.closed) h += `<div class="card"><div class="verdict">${G.decision === 'timeout' ? 'No decision in time' : 'Decision: '+esc(O.dec[G.decision].nm)}</div><p class="mute sm">Time runs fast to the outcome.</p></div>`;
  $('#body').innerHTML = h;
}
// ----- evidence images (generated, seeded) -----
function opImg(G, id){
  const f = G.findings.find(x => x.key === id); if (!f || !f.img) return '';
  const k = f.k || G.truth, r = mulberry(hash(G.seed + id)), R = (a,b) => a + r()*(b-a);
  let s = '', cap = '';
  const V = (x,y,w,h,c,rot=0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" transform="rotate(${rot} ${x+w/2} ${y+h/2})"/>`;
  if (f.img === 'cloud'){
    s = `<rect width="300" height="150" fill="#4a5560"/>` + [...Array(14)].map(() => `<ellipse cx="${R(0,300)}" cy="${R(0,150)}" rx="${R(40,90)}" ry="${R(20,40)}" fill="#e8eef2" fill-opacity="${R(.55,.9)}"/>`).join('');
    cap = 'OPTICAL · CLOUD COVER 94%';
  } else if (f.img === 'column'){
    s = `<rect width="300" height="150" fill="#3a4632"/><path d="M0,95 C80,85 160,70 300,40" stroke="#6b6650" stroke-width="18" fill="none"/>`;
    for (let i=0;i<13;i++){ const x = 10 + i*22, y = 92 - i*4.2 + R(-2,2);
      if (k==='A') s += V(x,y-4,14,8,'#1f2a1a',-12) + `<line x1="${x+7}" y1="${y}" x2="${x+18}" y2="${y-3}" stroke="#111" stroke-width="2"/>`;
      if (k==='B') s += V(x,y-4,14,8,'#56614a',-12) + `<path d="M${x+4},${y-3} l6,5 M${x+10},${y-3} l-6,5" stroke="#fff" stroke-width="1.3"/>`;
      if (k==='C') s += i%3===0 ? V(x,y-4,20,7,'#e0b23a',-12) : V(x+2,y-3,9,6,['#c44','#48c','#ddd','#3a3'][i%4],-12); }
    if (k==='B') s += [0,1,2].map(i => `<path d="M${40+i*30},130 l10,-14 l10,14z" fill="#8a8f70"/>`).join('');
    if (k==='C') s += [...Array(20)].map(() => `<circle cx="${R(0,300)}" cy="${R(100,118)}" r="1.6" fill="#f2e6c9"/>`).join('');
    cap = 'OPTICAL · 0.5 m · COLUMN NEAR ORLA';
  } else if (f.img === 'site' || f.img === 'change'){
    const pic = (kk, ox, w, old) => { let q = `<rect x="${ox}" width="${w}" height="150" fill="#8a7a5c"/>`;
      if (old) return q + `<path d="M${ox},120 C${ox+w*.4},110 ${ox+w*.6},130 ${ox+w},118" stroke="#6d6148" stroke-width="4" fill="none"/>`;
      if (kk==='A') q += `<path d="M${ox+10},120 C${ox+w*.3},40 ${ox+w*.7},40 ${ox+w-10},120" stroke="#cfc6b4" stroke-width="5" fill="none"/>` + [.35,.65].map(p => `<circle cx="${ox+w*p}" cy="75" r="14" fill="#bdb8ae" stroke="#5c5545" stroke-width="4"/>`).join('') + `<rect x="${ox+w*.45}" y="100" width="${w*.12}" height="22" fill="#4f5b3a" fill-opacity=".8"/>`;
      if (kk==='B') q += [0,1,2,3].map(i => `<ellipse cx="${ox+w*.5}" cy="75" rx="${w*.42-i*w*.08}" ry="${55-i*12}" fill="${['#9a8462','#86704f','#73603f','#5b4a31'][i]}"/>`).join('') + [0,1,2].map(i => V(ox+w*(.25+i*.2),40+i*18,8,5,'#e3c23a')).join('');
      if (kk==='C') q += [[.28,48],[.7,52],[.45,108]].map(([p,y]) => `<circle cx="${ox+w*p}" cy="${y}" r="${w*.17}" fill="#4f8a3a"/><line x1="${ox+w*p}" y1="${y}" x2="${ox+w*p+w*.16}" y2="${y}" stroke="#ddd"/>`).join('') + `<path d="M${ox},140 L${ox+w},132" stroke="#3a7ab0" stroke-width="4"/>`;
      return q; };
    if (f.img === 'site'){ s = pic(k, 0, 300, false); cap = 'OPTICAL · 0.5 m · '+G.V.P.toUpperCase(); }
    else { s = pic(k, 0, 148, true) + pic(k, 152, 148, false) + `<rect x="148" width="4" height="150" fill="#07111A"/><text x="8" y="16" font-size="10" fill="#fff" font-weight="700">BEFORE · 6 MONTHS AGO</text><text x="160" y="16" font-size="10" fill="#fff" font-weight="700">NOW</text>`; cap = 'CHANGE DETECTION'; }
  } else if (f.img === 'sar'){
    s = `<rect width="300" height="150" fill="#0b0b0b"/>` + [...Array(260)].map(() => `<rect x="${R(0,300)}" y="${R(0,150)}" width="1.5" height="1.5" fill="#777"/>`).join('');
    if (k==='A') s += [0,1,2,3].map(i => `<rect x="${90+i*30}" y="${60+i*3}" width="22" height="5" fill="#fff"/>`).join('');
    if (k==='B') s += [[80,50],[150,90],[210,60]].map(([x,y]) => `<rect x="${x}" y="${y}" width="12" height="9" fill="#fff"/><circle cx="${x+20}" cy="${y+4}" r="3" fill="#ddd"/>`).join('');
    if (k==='C') s += `<path d="M20,120 L280,40" stroke="#fff" stroke-width="2"/>` + [70,140,210].map(x => `<circle cx="${x}" cy="${120-(x-20)*.31}" r="6" fill="none" stroke="#fff" stroke-width="2"/>`).join('');
    cap = 'RADAR (SAR) · SEES THROUGH CLOUD';
  } else if (f.img === 'thermal'){
    s = `<rect width="300" height="150" fill="#120a2a"/>`;
    const spot = (x,y,rad,c) => `<circle cx="${x}" cy="${y}" r="${rad}" fill="${c}" fill-opacity=".85"/>`;
    if (k==='A') s += spot(150,80,26,'#ff3d00') + spot(150,80,12,'#ffe14d') + spot(110,95,8,'#ff8a00');
    if (k==='B') s += spot(200,70,20,'#ff8a00') + spot(200,70,8,'#ffe14d') + `<rect x="60" y="60" width="90" height="40" fill="#5b2a8a"/>`;
    if (k==='C') s += [[80,60],[160,70],[230,90]].map(([x,y]) => spot(x,y,30,'#1b4dbf')).join('') + spot(130,115,6,'#ff8a00');
    cap = 'THERMAL · NIGHT · WARM = BRIGHT';
  } else if (f.img === 'cctv'){
    s = `<rect width="300" height="150" fill="#2b3036"/><rect x="0" y="110" width="300" height="40" fill="#3b4046"/>`;
    if (G.op === 'lantern'){ const bg = {A:'<rect x="20" y="20" width="60" height="90" fill="#4a4f55"/><rect x="34" y="40" width="30" height="70" fill="#1c1f22"/>', B:'<rect x="20" y="30" width="260" height="20" fill="#4a4f55"/><text x="150" y="45" text-anchor="middle" font-size="11" fill="#cfd6dd">TICKETS</text>', C:'<path d="M0,90 L300,80 L300,110 L0,110Z" fill="#244a63"/>'}[k]; s += bg + `<circle cx="160" cy="62" r="11" fill="#55595e"/><rect x="146" y="73" width="28" height="42" rx="6" fill="#55595e"/>`; }
    else s += `<rect x="20" y="40" width="80" height="40" rx="4" fill="#d8d8d8"/><rect x="30" y="48" width="20" height="14" fill="#556"/><circle cx="40" cy="82" r="7" fill="#111"/><circle cx="88" cy="82" r="7" fill="#111"/>` + (k==='C' ? '<text x="60" y="70" text-anchor="middle" font-size="8" fill="#333">FJELL</text>' : '') + `<circle cx="180" cy="62" r="10" fill="#55595e"/><rect x="168" y="72" width="24" height="40" rx="6" fill="#55595e"/>`;
    s += `<rect width="300" height="150" fill="url(#scan)" opacity=".3"/>`;
    cap = 'CCTV · '+hhmm(f.t).replace(':','')+' · LOW RES';
  } else if (f.img === 'ledger'){
    const V2 = G.V, rows = {
      A:[[V2.CO,'Hearth Aid Fund','9,900'],[V2.CO,'Hearth Aid Fund','9,900'],[V2.CO,'Olen Exports','9,800'],['Hearth Aid Fund','Acct. in Red Pass','29,500'],['Acct. in Red Pass','Wallet …7f3a','29,100']],
      B:[[V2.CO,'Dalby Consult','48,000'],['Dalby Consult','Ostrel Imports','47,500'],['Ostrel Imports','Isla Brent Ltd','47,200'],['Isla Brent Ltd',V2.S+' (private)','46,900']],
      C:[[V2.CO,'40 accounts in '+V2.P,'312 avg'],[V2.CO,'Payroll ref. 11/25','9,600'],['Worker K. Saar','Family, '+V2.P,'350'],['Worker J. Telin','Family, '+V2.P,'410']]}[k];
    return `<table class="ledg"><tr><th>From</th><th>To</th><th>Crowns</th></tr>${rows.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${x[2]}</td></tr>`).join('')}</table><span class="src">Bank records · transaction graph</span>`;
  }
  return `<svg class="oimg" viewBox="0 0 300 150" role="img" aria-label="${esc(f.title)}"><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000"/></pattern></defs>${s}<rect x="0" y="134" width="300" height="16" fill="rgba(0,0,0,.6)"/><text x="6" y="146" font-size="10" font-family="monospace" fill="#9FDCEB">${esc(cap)}</text></svg>`;
}
function opModal(m){
  const G = GS, O = OPN();
  if (m.type === 'obrief') return `<div class="alert"><b>${I('alert',14)} ${O.code} · ${hhmm(G.t)} · ${esc(O.kind.toUpperCase())}</b><div>${fill(O.alert, G)}</div></div>
    <p class="sm">${esc(O.learn)}</p>
    <p class="mute sm">Tools: <b>${O.tabs.map(t => t[2]).join(', ')}</b> tabs. Every check costs minutes. The clock runs: 1 s = 1 min. Space pauses.</p>
    <div class="row">${CR.tut && CR.tut[G.op] ? '' : `<button class="btn" data-act="opStart" data-op="${G.op}" data-tut="1">Tutorial first</button>`}<button class="btn pri" data-act="close">Open the case</button></div>`;
  if (m.type === 'otut') return `<h2>${I(O.ic,18)} ${m.first ? 'Tutorial: ' : ''}${esc(O.name)} · ${esc(O.kind)}</h2><p class="sm">${esc(O.learn)}</p>
    <ol class="steps">${O.tut.map(s => `<li><span>${s.x.replace(/<span class="mute">.*?<\/span>/,'')}</span></li>`).join('')}</ol>
    <p class="mute sm">${m.first ? 'The hint bar guides you step by step, and the next tool glows.' : 'In a normal case nobody tells you the order: pick tools by what they cost and what they can rule out.'}</p>
    <div class="row"><button class="btn pri" data-act="close">${m.first ? 'Start' : 'Back'}</button></div>`;
  if (m.type === 'opurp'){ const t = O.tasks.find(x => x.id === m.id);
    return `<h2>${I('lock',18)} ${esc(O.restrictName)}</h2><p>This data is restricted. To use it you must state why. The request and your purpose go into the audit log that oversight reviews.</p>
    <button class="btn choice" data-act="opurpLog" data-id="${t.id}"><b>Purpose: ${O.code}, ${esc(O.kind.toLowerCase())}</b><small>Logged · +1 min. Covers all restricted data in this case.</small></button>
    <button class="btn choice red" data-act="opurpOver" data-id="${t.id}"><b>Use admin override</b><small>No wait, no purpose stated. Flagged in the audit.</small></button>
    <div class="row"><button class="btn" data-act="cancel">Cancel</button></div>`; }
  if (m.type === 'oimg'){ const f = G.findings.find(x => x.key === m.id);
    return `<div class="lbl"><span>${esc(f.src)}</span><span>${hhmm(f.t)}</span></div><h2>${esc(f.title)}</h2>${opImg(G, m.id)}<p class="mute sm">${esc(f.text)}</p><div class="row"><button class="btn pri" data-act="close">Add to case</button></div>`; }
  if (m.type === 'odecide'){
    const p = opProbs(G), b = opBest(p), n = G.findings.filter(f => f.w).length;
    return `<h2>Decide</h2><p class="mute sm">One decision. ${blind(G) ? 'No assessment at this clearance.' : `Lattice says: <b style="color:${O.col[b]}">${esc(O.hyp[b])} ${Math.round(p[b]*100)}%</b>`} from ${n} piece${n===1?'':'s'} of evidence.</p>
      ${Object.keys(O.dec).map(k => { const D = O.dec[k], nd = D.need && O.tasks.find(t => t.id === D.need);
        return `<button class="btn choice ${m.d===k?'on':''}" data-act="opick" data-d="${k}"><b>${I(D.ic)} ${esc(D.nm)}</b> <span class="mute">· ${esc(D.sub)}</span>${nd ? `<small class="${G.done[nd.id]?'ok':'wn'}">${G.done[nd.id] ? '✓ '+esc(nd.nm)+' obtained' : '⚠ No '+esc(nd.nm.toLowerCase())+' yet: acting now would be unlawful'}</small>` : ''}</button>`; }).join('')}
      ${!n ? '<p class="wn sm">You haven’t gathered any evidence yet.</p>' : ''}
      <div class="row"><button class="btn" data-act="cancel">Not yet</button><button class="btn pri hold" data-act="odecide" ${m.d ? '' : 'disabled'}><span>${m.d ? 'Hold to confirm: '+esc(O.dec[m.d].nm) : 'Pick an action'}</span></button></div>`;
  }
  return '';
}
function opEndHTML(){
  const G = GS, O = OPN(), sc = opScore(G), p = opProbs(G), lb = opBest(p), n = G.findings.filter(f => f.w).length;
  const head = G.decision === 'timeout' ? 'Time ran out. '+fill({A:'The threat played out unopposed.', B:'Nothing was done; it mostly blew over.', C:'Nothing was done.'}[G.truth], G) : fill(O.dec[G.decision].out[G.truth], G);
  const J = G.decision === 'timeout' ? 0 : (G.judge ?? opJudge(G, G.decision));
  const luck = !sc.good && J >= 70 ? `<p class="sm" style="margin-top:6px"><span class="flag info">good read, bad luck</span> Your evidence really did point this way.</p>` : sc.good && J < 45 && G.decision !== 'timeout' ? `<p class="sm" style="margin-top:6px"><span class="flag warn">lucky</span> It worked out, but your evidence didn’t support this call.</p>` : '';
  const mis = G.findings.filter(f => f.mis);
  const have = new Set(G.findings.map(f => f.key)), ti = OPK.indexOf(G.truth);
  const miss = O.tasks.filter(t => t.r && !have.has(t.id)).map(t => ({t, q:t.r[G.truth][2][ti] / Math.max(...t.r[G.truth][2].filter((_,i) => i !== ti))})).filter(x => x.q > 1.5).sort((a,b) => b.q - a.q)[0];
  const cf = Object.keys(O.dec).map(k => `<div class="${G.decision===k?'you':''} ${O.dec[k].pay[G.truth]===100?'best':''}"><b>${letter(O.dec[k].pay[G.truth])}</b>${esc(O.dec[k].nm)}${G.decision===k?' · you':''}</div>`).join('');
  return `${CLASSBAR}<div class="end">
   <div class="hero ${sc.good?'good':'bad'}"><div class="grade ${sc.good?'ok':'no'}">${sc.grade}</div>
    <div class="meta">${O.code} · ${esc(O.kind.toUpperCase())} · ${hhmm(G.res.t)} · SEED ${esc(G.seed)}${G.tut ? ' · TUTORIAL' : ''}</div>
    <h1>${esc(head)}</h1><p>${fill(O.truth[G.truth], G)}</p></div>
   <div class="card"><div class="lbl"><span>Your decision</span><span>${hhmm(G.decidedAt)}</span></div>
    <div class="verdict">${G.decision === 'timeout' ? 'None: the deadline passed' : I(O.dec[G.decision].ic,18)+' '+esc(O.dec[G.decision].nm)}</div>
    <p class="mute sm" style="margin-top:4px">${n ? `Your evidence pointed to <b style="color:${O.col[lb]}">${esc(O.hyp[lb])} (${Math.round(p[lb]*100)}%)</b>.` : 'You decided with no evidence, on the base rate alone.'} The truth: <b style="color:${O.col[G.truth]}">${esc(O.hyp[G.truth])}</b>.</p>${luck}</div>
   <div class="card"><div class="lbl"><span>Clues</span><span>${n} collected</span></div>
    ${mis.length ? mis.map(f => `<div class="ev" style="border-color:var(--red)"><b>Misleading: ${esc(f.src)}</b><span>“${esc(f.title)}” pointed the wrong way. Sources like this are wrong sometimes.</span></div>`).join('') : ''}
    ${miss ? `<div class="ev" style="border-color:var(--amber)"><b>Missed: ${esc(miss.t.nm)}</b><span>${esc(fill(miss.t.r[G.truth][0], G))}</span></div>` : '<p class="mute sm">You found every telling clue.</p>'}</div>
   <div class="card"><div class="lbl"><span>How each call would have ended</span></div><div class="cf">${cf}</div></div>
   ${uplinkCard(G, sc)}
   <div class="card"><div class="lbl"><span>Score</span><span>${sc.s}/100</span></div><div class="sc">${sc.L.map(l => `<div><span>${esc(l[0])}</span><b class="${l[1]>0?'ok':l[1]<0?'no':'mute'}">${l[1]>0?'+':''}${l[1]}</b></div>`).join('')}</div></div>
   <div class="card"><div class="lbl"><span>The lesson</span></div><p>${esc(O.lesson[G.truth])}</p></div>
   <div class="card"><div class="lbl"><span>Audit log (what oversight sees)</span></div><div class="audit">${G.audit.map(a => `<div class="${/OVERRIDE/.test(a.m)?'no':''}">${hhmm(a.t)} ${esc(a.m)}</div>`).join('')}</div></div>
   ${careerCard(G)}
   <div style="display:flex;gap:8px"><button class="btn pri" data-act="newRun">All operations</button>${G.daily ? `<button class="btn" data-act="copy" data-day="${G.daily}" id="copyb">Share result</button>` : `<button class="btn" data-act="opStart" data-op="${G.op}" data-new="1">${G.tut ? 'Play for real' : 'New '+esc(O.name)+' case'}</button>`}</div>
   ${G.daily && G.shareOpen ? `<textarea class="share" readonly aria-label="Share text">${esc(shareText(G.daily))}</textarea>` : ''}
  </div>`;
}
function opsListHTML(){
  CR.ob = CR.ob || {};
  const row = (ic, nm, kind, best, play, tut) => `<div class="oprow"><span class="oi">${I(ic,22)}</span><span class="on"><b>${nm}</b><small>${kind}${best ? ` · best <span class="ok">${best}</span>` : ''}</small></span>${tut}${play}</div>`;
  return `<label class="seclbl">Operations</label><div class="ops">
    ${row('ship','Border Watch','Sea border · unknown boat', ['D','S','L'].map(T => CR.bests[T]).filter(Boolean).sort()[0], `<button class="btn pri" data-act="start">Play</button>`, '<span></span>')}
    ${OPS_ORDER.map(k => { const O = OPS[k]; return row(O.ic, O.name, O.kind, CR.ob[k], `<button class="btn pri" data-act="opStart" data-op="${k}">Play</button>`, `<button class="btn" data-act="opStart" data-op="${k}" data-tut="1">Learn</button>`); }).join('')}</div>`;
}

// ---------- input & loop ----------
// Hold-to-confirm for the one irreversible call: pointer must stay down ~700 ms; keyboard Enter/Space confirms directly.
let holdT = null;
function holdStop(){ clearTimeout(holdT); holdT = null; document.querySelectorAll('.hold.arming').forEach(b => b.classList.remove('arming')); }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.hold'); if (!el || el.disabled) return;
  holdStop(); el.classList.add('arming'); buzz && buzz(10);
  holdT = setTimeout(() => { holdStop(); act(el.dataset.act, {...el.dataset}); }, 700);
});
['pointerup','pointerleave','pointercancel'].forEach(t => document.addEventListener(t, e => { if (holdT && (t !== 'pointerleave' || (e.target.classList && e.target.classList.contains('hold')))) holdStop(); }, true));
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.classList.contains('hold') && e.detail !== 0) return;
  if (el.classList.contains('modalbg') && e.target !== el) return;
  const d = {...el.dataset};
  if (d.act === 'start' || d.act === 'opStart'){ const inp = $('#seed'); d.seed = inp ? inp.value : ''; }
  act(d.act, d);
});
document.addEventListener('keydown', e => {
  if (!GS) return;
  if (e.target.tagName === 'INPUT'){ if (e.key === 'Enter' && GS.phase === 'title') act('start', {seed:e.target.value}); return; }
  if (GS.phase !== 'play') return;
  if (e.key === ' '){ e.preventDefault(); if (!GS.modal) act('pause'); }
  if (e.key === 'Escape' && GS.modal) act(['alert','help','idcards','oimg','obrief','otut'].includes(GS.modal.type) ? 'close' : 'cancel');
});
let ticks = 0;
addEventListener('visibilitychange', () => { if (document.hidden && GS) save(); });
addEventListener('pagehide', () => { if (GS) save(); });
setInterval(() => {
  if (!GS || GS.phase !== 'play') return;
  if (!GS.paused && !GS.modal){
    const n = GS.closed ? 15 : GS.speed;
    for (let i=0; i<n && GS.phase === 'play'; i++) step(0.1);
    if (GS.phase === 'end'){ save(); render(); return; }
  }
  frame();
  if (++ticks % 20 === 0) save();
}, 100);

// ---------- test hooks ----------
window.Lattice = {
  state: () => GS, act, truthOf, probs: () => probs(GS), career: () => CR, score: () => score(GS),
  step(min){ for (let i=0; i<Math.round(min*10) && GS.phase === 'play'; i++) step(0.1); save(); if (GS.phase === 'end') render(); else { dirty = true; frame(); renderModal(); } }
};
window.LatticeTests = { run(){
  const r = [], a = freshState('X1'), b = freshState('X1');
  r.push(['same seed, same case', JSON.stringify(a.sc) === JSON.stringify(b.sc) && a.truth === b.truth]);
  const seen = new Set(); for (let i=0;i<60;i++) seen.add(truthOf('S'+i));
  r.push(['all three cases occur', seen.size === 3]);
  r.push(['every case has a weak or strong face match', ['D','S','L'].every(T => { let s='S0'; for (let i=0;i<80&&truthOf(s)!==T;i++) s='S'+(i+1); return freshState(s).sc.C.people.some(p => !p.crowd); })]);
  return {passed: r.every(x => x[1]), results: r};
} };

loadCareer();
GS = load() || {v:5, phase:'title', seed:'NIGHT-01'};
if (GS.phase === 'play' && GS.lvl == null) GS.lvl = 1;
render();
if (location.hash === '#selftest') console.log('selftest', JSON.stringify(LatticeTests.run()));
</script>
