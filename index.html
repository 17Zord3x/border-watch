  sun:'<circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/>',
  island:'<path d="M1 12.5c2-1 3.5-1 5 0s3 1 5 0 2.5-1 4 0M3 11l2-4 2 2 2-4 3 6"/>',
  drift:'<path d="M1.5 5c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 2.5-1.5 4 0M1.5 10c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 2.5-1.5 4 0"/><path d="M11 13.5h3.5V10"/>'
});
function intelHTML(G){
  const dc = domCount(G), e = G.esc || 0;
  return `<div class="intel">${Object.keys(DOMS).map(k => `<span class="${dc[k]?'on':''}"><b>${DOMS[k]}</b>${[0,1,2].map(i => `<i class="${dc[k]>i?'f':''}"></i>`).join('')}</span>`).join('')}</div>
   <div class="escm ${e>=40?'hot':''}"><span>Escalation <b>${e}</b>/100</span><span class="bar"><i style="width:${e}%"></i><em style="left:40%"></em><em style="left:70%"></em></span><small>${(G.escLog||[]).length ? G.escLog.map(x => esc(x[0])+' +'+x[1]).join(' · ') : 'Quiet so far. Smugglers may notice at 40.'}</small></div>
   <p class="mute xs">Domains: a 2nd source in the same domain counts 60%, a 3rd 35%. Spread your checks.</p>`;
}
function assessCard(G, p, n, keys, names, cols, base){
  const b = keys.reduce((a,k) => p[k] > p[a] ? k : a, keys[0]);
  if (blind(G)) return `<div class="card"><div class="lbl"><span>Lattice assessment</span><span>${I('lock',12)} clearance 4</span></div><div class="mute sm">Assessment switched off at this clearance. You have ${n} piece${n===1?'':'s'} of evidence in the Case tab: weigh them yourself.</div>${intelHTML(G)}</div>`;
  const dc = domCount(G), cov = Object.values(dc).filter(x => x).length, wid = Math.max(5, Math.round(40 / (1 + 0.5*cov)));
  const rng = v => { const c = Math.round(v*100); return Math.max(0, c-wid) + '–' + Math.min(100, c+wid) + '%'; };
  const verdict = !n ? `<div class="verdict mute">No evidence yet</div><div class="mute sm">Starting guess from past cases. ${esc(base)} That’s a base rate, not evidence.</div>`
    : `<div class="verdict" style="color:${cols[b]}">${esc(names[b])} · ${rng(p[b])}</div><div class="mute sm">${p[b] < .75 ? 'Not sure yet' : 'Fairly sure'} · ${n} piece${n>1?'s':''} of evidence. The range narrows as you cover more domains.</div>`;
  return `<div class="card"><div class="lbl"><span>Lattice assessment</span><span>±${wid}%</span></div>${verdict}
    <div class="tri">${keys.map(k => `<b style="width:${(p[k]*100).toFixed(1)}%;background:${cols[k]}"></b>`).join('')}</div>
    <div class="legend">${keys.map(k => `<span style="color:${cols[k]}">${esc(names[k])} ${rng(p[k])}</span>`).join('')}</div>${intelHTML(G)}</div>`;
}

// ---------- input & loop ----------
// Hold-to-confirm for the one irreversible call: pointer must stay down ~700 ms; keyboard Enter/Space confirms directly.
let holdT = null;
function holdStop(){ clearTimeout(holdT); holdT = null; document.querySelectorAll('.hold.arming').forEach(b => b.classList.remove('arming')); }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.hold'); if (!el || el.disabled) return;
  holdStop(); el.classList.add('arming'); buzz && buzz(10);
  holdT = setTimeout(() => { holdStop(); act(el.dataset.act, {...el.dataset}); }, 700);
});
['pointerup','pointerleave','pointercancel'].forEach(t => document.addEventListener(t, e => { if (holdT && (t !== 'pointerleave' || (e.target.classList && e.target.classList.contains('hold')))) holdStop(); }, true));
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.classList.contains('hold') && e.detail !== 0) return;
  if (el.classList.contains('modalbg') && e.target !== el) return;
  const d = {...el.dataset};
  if (d.act === 'start'){ const inp = $('#seed'); d.seed = inp ? inp.value : ''; }
  act(d.act, d);
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.hasAttribute && d.hasAttribute('data-audit') && GS) GS.auditOpen = d.open; }, true);
document.addEventListener('keydown', e => {
  if (!GS) return;
  if (e.target.closest && e.target.closest('#auth')) return;
  if (e.target.tagName === 'INPUT'){ if (e.key === 'Enter' && GS.phase === 'title') act('start', {seed:e.target.value}); return; }
  if (GS.phase !== 'play') return;

  if (e.key === 'Escape' && GS.modal) act(['alert','help','idcards'].includes(GS.modal.type) ? 'close' : 'cancel');
});
let ticks = 0;
addEventListener('visibilitychange', () => { if (document.hidden && GS) save(); });
addEventListener('pagehide', () => { if (GS) save(); });
setInterval(() => {
  if (!GS || GS.phase !== 'play') return;
  if (!GS.paused && !GS.modal && acting(GS)){
    const n = GS.closed ? 15 : GS.speed * 2;
    AN.prev = {}; for (const k in GS.units) AN.prev[k] = {x:GS.units[k].x, y:GS.units[k].y}; AN.last = performance.now(); AN.rate = n*0.1;
    for (let i=0; i<n && GS.phase === 'play' && !GS.modal; i++) step(0.1);
    if (GS.modal) renderModal();
    if (GS.phase === 'end'){ save(); render(); return; }
  } else { AN.rate = 0; AN.prev = {}; for (const k in GS.units) AN.prev[k] = {x:GS.units[k].x, y:GS.units[k].y};
    if (!GS.paused && !GS.modal && !GS.closed && !GS.res && timeLeft(GS) < 0.05){ GS.modal = {type:'decide', d:null, b:null, forced:true}; tick('Watch time is up. Decide now.'); renderModal(); } }
  frame();
  if (++ticks % 20 === 0) save();
}, 100);

// ---------- test hooks ----------
window.Lattice = {
  state: () => GS, act, truthOf, probs: () => probs(GS), career: () => CR, score: () => score(GS),
  step(min){ for (let i=0; i<Math.round(min*10) && GS.phase === 'play'; i++) step(0.1); save(); if (GS.phase === 'end') render(); else { dirty = true; frame(); renderModal(); } }
};
window.LatticeTests = { run(){
  const r = [], a = freshState('X1'), b = freshState('X1');
  r.push(['same seed, same case', JSON.stringify(a.sc) === JSON.stringify(b.sc) && a.truth === b.truth]);
  const seen = new Set(); for (let i=0;i<60;i++) seen.add(truthOf('S'+i));
  r.push(['all three cases occur', seen.size === 3]);
  const envs = new Set(); for (let i=0;i<80;i++) envs.add(rollCase('E'+i).E);
  r.push(['all six conditions occur', envs.size === 6]);
  r.push(['every situation builds', STORY_KEYS.every(k => { let sd = null; for (let i=0;i<4000 && !sd;i++) if (rollCase('Q'+i).story === k) sd = 'Q'+i; return sd && freshState(sd).sc.C.people.length > 0; })]);
  r.push(['every case has a weak or strong face match', ['D','S','L'].every(T => { let s='S0'; for (let i=0;i<80&&truthOf(s)!==T;i++) s='S'+(i+1); return freshState(s).sc.C.people.some(p => !p.crowd); })]);
  return {passed: r.every(x => x[1]), results: r};
} };

loadCareer();
GS = load() || {v:6, phase:'title', seed:'NIGHT-01'};
if (GS.phase === 'play' && GS.lvl == null) GS.lvl = 1;
render();
if (location.hash === '#selftest') console.log('selftest', JSON.stringify(LatticeTests.run()));
try { document.documentElement.style.setProperty('--seabg', `url("${mapBG('storm')}")`); } catch(e){}
</script>
<div id="auth" hidden></div>
<script type="module">
// ---------- accounts (Firebase Auth + Firestore) ----------
// Paste the config from Firebase console > Project settings > Your apps > Web app.
// While it is null, accounts are off and the game plays without signing in.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDc1f4MRO3yuJtDzV7fYAuH2BO2O0WAkfQ",
  authDomain: "border-watch-a8e51.firebaseapp.com",
  projectId: "border-watch-a8e51",
  storageBucket: "border-watch-a8e51.firebasestorage.app",
  messagingSenderId: "148134679248",
  appId: "1:148134679248:web:8b04c4d8f4f2687f5044d5"
};
const ONLINE_MIN = 2, BEAT_MS = 60000;
const box = document.getElementById('auth');
const A = window.BWAuth = {user:null, admin:false, ready:false, online:null};
const h = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rerender = () => { try { if (GS && GS.phase === 'title') render(); } catch(e){} };

let F, auth, db, mode = 'signin', busy = false, pendingName = '', beat = null, statsTimer = null;
async function boot(){
  show('loading');
  const V = '10.12.2', B = 'https://www.gstatic.com/firebasejs/' + V + '/';
  const [app, au, fs] = await Promise.all([import(B+'firebase-app.js'), import(B+'firebase-auth.js'), import(B+'firebase-firestore.js')]);
  F = {...au, ...fs};
  const fa = app.initializeApp(FIREBASE_CONFIG); auth = au.getAuth(fa); db = fs.getFirestore(fa);
  au.onAuthStateChanged(auth, async u => {
    A.ready = true;
    if (!u){ A.user = null; A.admin = false; stopBeat(); show(mode); rerender(); return; }
    try { await enter(u); } catch(e){ console.warn('account sync', e); }
    hide(); rerender();
  });
}
const nameOf = u => ((u.displayName || pendingName || (u.email || 'Analyst').split('@')[0]).trim() || 'Analyst').slice(0, 24);
async function enter(u){
  const name = nameOf(u), ref = F.doc(db, 'users', u.uid), snap = await F.getDoc(ref);
  A.user = {uid:u.uid, name};
  if (!snap.exists()) await F.setDoc(ref, {name, createdAt:F.serverTimestamp(), lastLogin:F.serverTimestamp(), lastSeen:F.serverTimestamp(), logins:0});
  try { A.admin = (await F.getDoc(F.doc(db, 'admins', u.uid))).exists(); } catch(e){ A.admin = false; }
  // one login per browser session (a reload is not a new login); admin sign-ins are never counted
  let fresh = true; try { const k = 'bw-login-' + u.uid; fresh = !sessionStorage.getItem(k); sessionStorage.setItem(k, '1'); } catch(e){}
  if (fresh && !A.admin){
    await F.updateDoc(ref, {name, lastLogin:F.serverTimestamp(), lastSeen:F.serverTimestamp(), logins:F.increment(1)});
    await F.addDoc(F.collection(db, 'logins'), {uid:u.uid, name, at:F.serverTimestamp()});
  }
  if (A.admin) F.deleteDoc(F.doc(db, 'presence', u.uid)).catch(() => {});
  startBeat();
}
function startBeat(){
  stopBeat();
  const ping = () => { if (!A.user || document.hidden) return; const uid = A.user.uid;
    F.updateDoc(F.doc(db, 'users', uid), {lastSeen:F.serverTimestamp()}).catch(() => {});
    (A.admin ? Promise.resolve() : F.setDoc(F.doc(db, 'presence', uid), {at:F.serverTimestamp()}).catch(() => {})).then(countOnline); };
  ping(); beat = setInterval(ping, BEAT_MS); document.addEventListener('visibilitychange', ping);
}
function stopBeat(){ if (beat) clearInterval(beat); beat = null; }
// public: how many signed-in players were active in the last ONLINE_MIN minutes (everyone can see this number, nothing else)
const onlineQ = () => F.query(F.collection(db, 'presence'), F.where('at', '>=', F.Timestamp.fromMillis(Date.now() - ONLINE_MIN*60000)));
async function countOnline(){ try { A.online = (await F.getCountFromServer(onlineQ())).data().count; rerender(); } catch(e){ console.warn('online count', e); } }

// ---------- screens ----------
const LOGO_HTML = () => { try { return LOGO; } catch(e){ return ''; } };
function frameHTML(inner){
  return `<div class="title"><div class="stage"><div class="box" role="dialog" aria-modal="true" aria-labelledby="auth-h"><div class="bh">${LOGO_HTML()}LATTICE<span class="mute" style="font-weight:400;letter-spacing:0;margin-left:auto">Analyst access</span></div><div class="bb">${inner}</div></div></div></div>`;
}
function show(m, err){
  if (m !== 'loading') mode = m;
  box.hidden = false; document.body.classList.add('authon');
  if (m === 'loading'){ box.innerHTML = frameHTML(`<h1 id="auth-h">Border Watch</h1><p class="mute">Connecting…</p>`); return; }
  if (m === 'stats'){ box.innerHTML = frameHTML(`<h1 id="auth-h">Players</h1><div id="auth-stats"><p class="mute">Loading…</p></div>
    <div class="row" style="margin-top:12px"><button class="btn" data-auth="refresh">Refresh</button><button class="btn pri" data-auth="close">Back to game</button></div>`); loadStats(); return; }
  const up = m === 'signup', reset = m === 'reset';
  box.innerHTML = frameHTML(`<h1 id="auth-h">${reset ? 'Reset password' : up ? 'Create account' : 'Sign in'}</h1>
    ${reset ? '' : `<div class="atabs" role="tablist"><button role="tab" class="${up?'':'on'}" aria-selected="${!up}" data-auth="signin">Sign in</button><button role="tab" class="${up?'on':''}" aria-selected="${up}" data-auth="signup">New account</button></div>`}
    <form class="af" novalidate>
      ${up ? `<label>Analyst name<input name="name" autocomplete="nickname" maxlength="24" required></label>` : ''}
      <label>Email<input name="email" type="email" autocomplete="email" inputmode="email" required></label>
      ${reset ? '' : `<label>Password<input name="pw" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="6" required></label>`}
      <p class="aerr" role="alert">${h(err || '')}</p>
      <button class="btn pri big" type="submit">${reset ? 'Send reset link' : up ? 'Create account' : 'Sign in'}</button>
    </form>
    ${reset ? `<button class="alink" data-auth="signin">Back to sign in</button>` : `<div class="aor"><span>or</span></div><button class="btn big" data-auth="google">Continue with Google</button>
    ${up ? '' : `<button class="alink" data-auth="reset">Forgot password?</button>`}`}
    <p class="mute xs" style="margin-top:10px">Your account stores your analyst name, email and when you sign in. Nothing else.</p>`);
  const f = box.querySelector('input'); if (f && !matchMedia('(pointer:coarse)').matches) f.focus();
}
function hide(){ box.hidden = true; box.innerHTML = ''; document.body.classList.remove('authon'); if (statsTimer) clearInterval(statsTimer); statsTimer = null; }
const MSG = {'auth/invalid-credential':'Wrong email or password.', 'auth/wrong-password':'Wrong email or password.', 'auth/user-not-found':'Wrong email or password.',
  'auth/email-already-in-use':'That email already has an account. Sign in instead.', 'auth/invalid-email':'That email address doesn’t look right.',
  'auth/weak-password':'Use at least 6 characters for the password.', 'auth/too-many-requests':'Too many tries. Wait a minute and try again.',
  'auth/popup-closed-by-user':'Google sign-in was closed.', 'auth/popup-blocked':'Your browser blocked the Google window. Allow pop-ups and try again.',
  'auth/network-request-failed':'No connection. Check your internet and try again.', 'auth/unauthorized-domain':'Google sign-in isn’t enabled for this site yet.'};
const say = e => MSG[e && e.code] || 'Something went wrong. Try again.';
function err(t){ const p = box.querySelector('.aerr'); if (p) p.textContent = t; }
async function run(fn){
  if (busy) return; busy = true; const b = box.querySelectorAll('button'); b.forEach(x => x.disabled = true);
  try { await fn(); } catch(e){ err(say(e)); } finally { busy = false; b.forEach(x => x.disabled = false); }
}
box.addEventListener('submit', e => {
  e.preventDefault(); const fd = new FormData(e.target), email = String(fd.get('email') || '').trim(), pw = String(fd.get('pw') || ''), name = String(fd.get('name') || '').trim().slice(0, 24);
  if (!email) return err('Enter your email.');
  if (mode === 'reset') return run(async () => { await F.sendPasswordResetEmail(auth, email); err('If that email has an account, a reset link is on its way.'); });
  if (pw.length < 6) return err('Use at least 6 characters for the password.');
  if (mode === 'signup'){ if (!name) return err('Pick an analyst name.');
    pendingName = name; return run(async () => { const c = await F.createUserWithEmailAndPassword(auth, email, pw); await F.updateProfile(c.user, {displayName:name}); }); }
  run(() => F.signInWithEmailAndPassword(auth, email, pw));
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-auth]'); if (!el || el.disabled) return; e.preventDefault();
  const k = el.dataset.auth;
  if (k === 'signin' || k === 'signup' || k === 'reset') return show(k);
  if (k === 'google') return run(() => F.signInWithPopup(auth, new F.GoogleAuthProvider()));
  if (k === 'out'){ stopBeat(); mode = 'signin'; const u = A.user; A.online = null; try { if (u) sessionStorage.removeItem('bw-login-' + u.uid); } catch(e){}
    return (u ? F.deleteDoc(F.doc(db, 'presence', u.uid)).catch(() => {}) : Promise.resolve()).then(() => F.signOut(auth)); }
  if (k === 'stats' && A.admin) return show('stats');
  if (k === 'refresh') return loadStats();
  if (k === 'close') return hide();
});

// ---------- admin stats (only readable by accounts listed in /admins) ----------
async function loadStats(){
  const el = document.getElementById('auth-stats'); if (!el) return;
  if (!statsTimer) statsTimer = setInterval(loadStats, 30000);
  try {
    const now = Date.now(), day = new Date(); day.setHours(0,0,0,0);
    const users = F.collection(db, 'users'), logins = F.collection(db, 'logins'), ts = ms => F.Timestamp.fromMillis(ms);
    // the admin's own account is left out of every number below
    const me = A.user && A.user.uid, ms = d => d && d.toMillis ? d.toMillis() : d && d.ms != null ? d.ms : 0;
    const [all, mine, on, wk] = await Promise.all([
      F.getCountFromServer(users), F.getDoc(F.doc(db, 'users', me)),
      F.getCountFromServer(onlineQ()),
      F.getDocs(F.query(logins, F.where('at', '>=', ts(now - 7*864e5)), F.orderBy('at', 'desc')))]);
    const others = wk.docs.map(d => d.data()).filter(v => v.uid !== me);
    const cnt = {all:{data:() => ({count: Math.max(0, all.data().count - (mine.exists() ? 1 : 0))})},
      today:{data:() => ({count: others.filter(v => ms(v.at) >= day.getTime()).length})}, week:{data:() => ({count: others.length})}};
    const today = cnt.today, week = cnt.week, recent = {docs: others.slice(0, 30).map(v => ({data:() => v}))};
    const n = q => q.data().count, t = d => { const x = d && d.toDate ? d.toDate() : null; return x ? x.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '…'; };
    el.innerHTML = `<div class="astats"><div><b>${n(on)}</b><small>online now</small></div><div><b>${n(cnt.all)}</b><small>accounts</small></div><div><b>${n(today)}</b><small>logins today</small></div><div><b>${n(week)}</b><small>last 7 days</small></div></div>
      <label class="seclbl">Recent logins</label><ol class="alog">${recent.docs.map(d => { const v = d.data(); return `<li><span>${h(v.name)}</span><time>${t(v.at)}</time></li>`; }).join('') || '<li class="mute">No logins yet.</li>'}</ol>
      <p class="mute xs">Online = active in the last ${ONLINE_MIN} minutes. Your own admin account is not counted. Updates every 30 s.</p>`;
  } catch(e){ el.innerHTML = `<p class="no">Couldn’t load stats (${h(e.code || 'error')}).</p>`; }
}
if (FIREBASE_CONFIG) boot().catch(e => { console.warn('accounts', e); show('signin', 'Could not reach the account service. Check your connection and reload.'); });
