<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1017">
<title>Border Watch</title>
<style>
/* Design language: dense dark analyst workspace (inspired by the open-source Blueprint UI system). */
:root{
 --bg:#111418;--panel:#1C2127;--panel2:#252A31;--panel3:#2F343C;--line:#383E47;--line2:#2F343C;
 --ink:#F6F7F9;--mute:#ABB3BF;--dim:#738091;
 --acc:#4C90F0;--acc2:#2D72D2;--green:#32A467;--amber:#EC9A3C;--red:#E76A6E;--violet:#9881F3;
 --mono:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
 --hdr:98px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.43 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
svg.i{display:inline-block;vertical-align:-3px;flex:none}
.mute{color:var(--mute)}.ok{color:#72CA9B}.no{color:#FA999C}.wn{color:#FBB360}
.sm{font-size:12.5px}
/* header */
.hdr{position:sticky;top:0;z-index:7}
.classbar{height:18px;background:#1C6E42;color:#E6F5EC;font:700 10.5px/18px var(--mono);letter-spacing:.14em;text-align:center;text-transform:uppercase}
.top{height:46px;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel2);box-shadow:0 1px 0 rgba(17,20,24,.6),0 1px 1px rgba(17,20,24,.4)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.06em;font-size:14px;min-width:0}
.brand .crumb{font-weight:400;letter-spacing:0;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;border-left:1px solid var(--line)}
.brand .crumb i{font-style:normal;color:var(--dim);margin:0 4px}
.clock{font:600 16px var(--mono);color:var(--ink);margin-left:auto;padding:0 8px;letter-spacing:.04em}
.ib{background:transparent;border:0;border-radius:2px;min-width:34px;height:32px;padding:0 8px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ib:hover{background:rgba(143,153,168,.15);color:var(--ink)}
.ib.on{background:var(--acc2);color:#fff}
.flow{height:34px;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.flow span{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:var(--dim);white-space:nowrap}
.flow span b{font:600 10px var(--mono);width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:2px;background:var(--panel3);color:var(--mute)}
.flow span.d{color:#72CA9B}.flow span.d b{background:rgba(35,133,81,.3);color:#72CA9B}
.flow span.c{color:var(--ink);background:rgba(45,114,210,.2)}.flow span.c b{background:var(--acc2);color:#fff}
.flow em{color:var(--line);font-style:normal}
/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:calc(100vh - var(--hdr))}
.mapcol{position:relative;background:#10161D;border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
svg.map{width:100%;flex:1;min-height:0;display:block}
svg.map text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;pointer-events:none}
.chips{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;right:8px}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(17,20,24,.88);border:1px solid var(--line);border-radius:2px;padding:2px 7px;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.chip.hot{border-color:var(--red);color:#FA999C}
.chip.busy{border-color:var(--amber);color:#FBB360}
.ticker{background:var(--panel);border-top:1px solid var(--line2);padding:7px 12px;font:12px var(--mono);min-height:34px;color:var(--ink)}
.ticker .tm{color:var(--acc);margin-right:8px}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line2)}
.tab{background:none;border:0;padding:8px 2px 7px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.tab.dec{color:var(--amber)}
.tab:disabled{opacity:.4}
.tab .bd{position:absolute;top:5px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.body{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.hint{display:flex;gap:8px;align-items:flex-start;background:rgba(45,114,210,.15);border-left:3px solid var(--acc2);border-radius:2px;padding:8px 10px;font-size:13px}
.hint svg{color:var(--acc);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:10px 12px 12px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card>.lbl{margin:-10px -12px 10px;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line2);border-radius:3px 3px 0 0}
.verdict{font-size:16px;font-weight:600}
.tri{display:flex;height:6px;border-radius:1px;overflow:hidden;margin-top:8px;background:var(--panel3);gap:1px}
.tri b{display:block;height:100%;transition:width .5s}
.legend{display:flex;justify-content:space-between;font-size:11px;margin-top:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:70px;position:relative;overflow:hidden}
.act:hover:not(:disabled){border-color:var(--acc2);background:#20262D}
.act .ic{color:var(--acc);height:18px}
.act .nm{font-weight:600;font-size:13.5px}
.act .ds{font-size:12px;color:var(--mute)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act.done{border-color:rgba(50,164,103,.45)}.act.done .ic{color:var(--green)}.act.done .nm::after{content:" ✓";color:var(--green)}
.act.go{border-color:var(--amber);opacity:1}.act.go .ic{color:var(--amber)}
.act .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--amber);width:0}
.wide{grid-column:1/-1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv>span:nth-child(odd){color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding-top:2px}
.src{font:11px var(--mono);color:var(--dim);display:block;margin-top:2px}
.flag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:2px}
.flag.bad{background:rgba(205,66,70,.25);color:#FA999C}.flag.ok{background:rgba(35,133,81,.25);color:#72CA9B}.flag.warn{background:rgba(200,118,25,.25);color:#FBB360}.flag.unk{background:rgba(143,153,168,.2);color:var(--mute)}.flag.info{background:rgba(45,114,210,.25);color:#8ABBFF}
.ev{border-left:2px solid var(--line);padding:3px 0 3px 10px;margin-top:8px}
.ev:first-of-type{margin-top:0}
.ev b{display:block;font-weight:600;font-size:13px}.ev span{font-size:13px;color:var(--mute)}
.pcard{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:8px 10px;text-align:left;width:100%}
.pcard:hover{border-color:var(--acc2)}
.av{width:40px;height:40px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--panel3);grid-row:1/3;font-size:13px}
.pcard .nm{font-weight:600}
.pcard .mt{grid-row:1/3;font:600 12px var(--mono);text-align:right}
.audit div{font:11.5px/1.5 var(--mono);padding:3px 0;border-top:1px solid var(--line2);color:var(--mute)}
.audit div:first-child{border-top:0}
.audit div.no{color:#FA999C}
svg.graph{width:100%;display:block;background:#161B21;border:1px solid var(--line2);border-radius:2px}
svg.graph text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;pointer-events:none}
/* dialogs */
.modalbg{position:fixed;inset:0;background:rgba(17,20,24,.7);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:4px 4px 0 0;max-width:520px;width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 0 0 1px rgba(17,20,24,.4),0 4px 8px rgba(17,20,24,.4),0 18px 46px 6px rgba(17,20,24,.4);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:761px){.modalbg{align-items:center}.sheet{border-radius:4px}}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sheet p{margin:8px 0}
.row{display:flex;gap:6px;margin-top:14px}
.btn{flex:1;min-height:40px;background:var(--panel3);border:0;border-radius:3px;padding:10px 12px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(17,20,24,.2),0 1px 2px rgba(17,20,24,.2)}
.btn:hover:not(:disabled){background:#383E47}
.btn.pri{background:var(--acc2);color:#fff}.btn.pri:hover:not(:disabled){background:#215DB0}
.btn.red{background:transparent;box-shadow:inset 0 0 0 1px rgba(231,106,110,.6);color:#FA999C}
.btn.grn{background:transparent;box-shadow:inset 0 0 0 1px rgba(50,164,103,.7);color:#72CA9B}
.btn:disabled{opacity:.45;cursor:not-allowed}
.choice{display:block;width:100%;text-align:left;margin-top:6px;background:var(--panel2)}
.choice b{display:inline-flex;align-items:center;gap:6px}
.choice small{display:block;font-weight:400;color:var(--mute);margin-top:2px}
.choice.on{box-shadow:inset 0 0 0 2px var(--acc);background:rgba(45,114,210,.15)}
.alert{border-left:3px solid var(--red);border-radius:2px;padding:10px 12px;background:rgba(205,66,70,.15);margin-bottom:10px}
.alert b{color:#FA999C;letter-spacing:.08em;font:700 12px var(--mono);display:flex;gap:6px;align-items:center;margin-bottom:4px}
.steps{padding-left:0;margin:6px 0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line2);color:var(--mute);font-size:13.5px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);font:600 11px var(--mono);flex:none;width:20px;height:20px;border-radius:2px;background:var(--panel3);color:var(--ink);display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--ink)}
/* ID card */
.idc{border-radius:3px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.idc .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font:700 10.5px var(--mono);letter-spacing:.12em;color:#fff}
.idc .bd2{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:10px 12px}
.idc .ph{width:80px;height:100px;border-radius:2px;background:var(--panel3);position:relative;overflow:hidden;border:1px solid var(--line)}
.idc .ph svg{position:absolute;inset:0;width:100%;height:100%}
.idc .f{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.idc .v{font-weight:600;font-size:14px;margin-bottom:4px}
.idc .mrz{font:600 11px var(--mono);color:var(--mute);padding:6px 12px 8px;letter-spacing:.06em;border-top:1px dashed var(--line);word-break:break-all;background:#20262D}
.match{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.match i{flex:1;height:6px;background:var(--panel3);border-radius:1px;overflow:hidden}
.match i b{display:block;height:100%}
.match>b{font-family:var(--mono);color:var(--ink)}
.rec{border:1px solid var(--line2);border-radius:3px;padding:10px;margin-top:10px;background:var(--panel)}
.rec.locked{border:1px dashed var(--line);text-align:center;color:var(--mute);background:repeating-linear-gradient(135deg,#1C2127 0 8px,#20262D 8px 16px)}
.rec.locked b{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--mono);letter-spacing:.1em;color:#FBB360}
.rec .ri{border-top:1px solid var(--line2);padding:6px 0;font-size:13.5px}
.rec .ri:first-of-type{border-top:0}
.dots{display:flex;gap:4px;justify-content:center;margin-top:10px}
.dots i{width:14px;height:3px;border-radius:1px;background:var(--line)}.dots i.on{background:var(--acc)}
/* title / end */
.title{min-height:100vh;display:flex;flex-direction:column}
.title .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;background-color:var(--bg);background-image:linear-gradient(rgba(56,62,71,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(56,62,71,.25) 1px,transparent 1px);background-size:32px 32px}
.box{max-width:480px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 18px 46px 6px rgba(17,20,24,.5)}
.box .bh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line2);font-weight:700;letter-spacing:.06em;font-size:13px}
.box .bb{padding:16px}
.title h1{font-size:28px;font-weight:600;letter-spacing:.02em;margin:2px 0 10px}
.title p{margin:10px 0;color:var(--mute)}
.title p b{color:var(--ink)}
.seedrow{display:flex;gap:6px;margin-top:16px}
.seedrow label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600;margin-top:14px}
.seedrow input{flex:1;min-width:0;background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:3px;padding:10px;color:var(--ink);font:600 14px var(--mono)}
.seedrow input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acc)}
.end{max-width:620px;margin:0 auto;padding:14px 12px 40px;display:flex;flex-direction:column;gap:8px}
.hero{border-radius:3px;padding:16px;border:1px solid var(--line2);border-left:4px solid var(--line);background:var(--panel)}
.hero.good{border-left-color:var(--green)}.hero.bad{border-left-color:var(--red)}
.hero h1{font-size:21px;font-weight:600;margin:4px 0 8px}
.hero .meta{font:600 11px var(--mono);letter-spacing:.08em;color:var(--dim)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}.opts div{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:rgba(255,255,255,.03);font-size:14px}.opts span{flex-basis:100%;font-size:12px}
.hero::after{content:"";display:block;clear:both}.hero h1{margin:6px 0!important}
.dbx{margin-top:4px!important;padding:4px 12px 8px!important;border:1px solid var(--line2);border-radius:6px;background:rgba(255,255,255,.02)}
.dbx .morein{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.grade{font:700 40px var(--mono);float:right;margin-left:10px;line-height:1;padding:6px 10px;border-radius:3px;background:var(--panel2)}
.sc div{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid var(--line2)}
.sc div b{font-family:var(--mono)}
.sc div:first-child{border-top:0}
/* career / meta */
.prof{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;margin:12px 0}
.prof .rk{font-weight:700}.prof .xp{flex:1;min-width:0}
.bar{height:6px;background:var(--panel3);border-radius:1px;overflow:hidden;margin-top:5px}.bar b{display:block;height:100%;background:var(--acc);transition:width .9s ease-out}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.lv{background:var(--panel2);border:0;border-radius:2px;padding:7px 0;font:700 13px var(--mono);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line2)}
.lv.on{background:var(--acc2);color:#fff;box-shadow:none}.lv:disabled{opacity:.45;cursor:not-allowed}
.rule{font-size:12.5px;color:var(--mute);margin-top:6px;min-height:18px}
.daily{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:3px;background:var(--panel2);margin-top:12px}
.daily .dt{flex:1}.daily .dt b{display:block}
.cal{display:flex;gap:3px;margin-top:6px}.cal i{flex:1;font:700 11px/22px var(--mono);text-align:center;border-radius:2px;background:var(--panel3);color:var(--dim);font-style:normal}
.cal i.g{background:rgba(35,133,81,.3);color:#72CA9B}.cal i.b{background:rgba(205,66,70,.25);color:#FA999C}
.tiny{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tiny .flag{font-size:10px}
.cf{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cf div{background:var(--panel2);border-radius:2px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mute);border:1px solid transparent}
.cf div b{display:block;font:700 20px var(--mono);color:var(--ink)}
.cf div.you{border-color:var(--acc)}.cf div.best b{color:#72CA9B}
.ach{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2);font-size:13px}
.ach:first-child{border-top:0}.ach svg{color:var(--amber)}
.ach.new{color:#FBB360}
.share{width:100%;min-height:64px;background:var(--bg);color:var(--ink);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:3px;font:12px var(--mono);padding:8px;margin-top:8px;resize:none}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}55%{transform:scale(1.25,.85)}75%{transform:scale(.92,1.08)}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px) rotate(-.6deg)}40%{transform:translate(5px,-2px) rotate(.5deg)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.fx .grade{animation:pop .6s .35s both cubic-bezier(.3,1.4,.5,1)}
.fx .hero.bad{animation:shake .45s .2s both}
.fx .end>.card{animation:rise .35s both}
.fx .end>.card:nth-child(2){animation-delay:.5s}.fx .end>.card:nth-child(3){animation-delay:.6s}.fx .end>.card:nth-child(4){animation-delay:.7s}.fx .end>.card:nth-child(5){animation-delay:.8s}
@media (prefers-reduced-motion:reduce){.fx *{animation:none!important}.bar b{transition:none}}
@media(max-width:760px){
 .main{display:block;height:auto}
 .brand .crumb{display:none}
 .mapcol{border-right:0;display:block;position:sticky;top:var(--hdr);z-index:4}
 svg.map{height:auto;aspect-ratio:900/470}
 .ticker{padding:5px 10px;font-size:11.5px;min-height:0}
 .panel{display:block}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;padding-bottom:env(safe-area-inset-bottom)}
 .body{overflow:visible;padding-bottom:80px}
}

/* ================= HUD / glass layer (v8) ================= */
:root{
 --bg:#060B10;--panel:rgba(14,24,33,.62);--panel2:rgba(22,36,48,.55);--panel3:rgba(60,90,110,.28);
 --line:rgba(110,200,240,.22);--line2:rgba(110,200,240,.13);
 --ink:#EAF6FB;--mute:#9DB3C2;--dim:#6B8292;
 --acc:#3DD6F5;--acc2:#0E8FB5;--green:#2FD18B;--amber:#F5B544;--red:#FF6B7A;--violet:#A78BFA;
 --glass:blur(14px) saturate(150%);--glow:0 0 0 1px rgba(61,214,245,.45),0 0 18px rgba(61,214,245,.22);
}
html,body{background:var(--bg)}
body{background-image:radial-gradient(1200px 600px at 70% -10%,rgba(61,214,245,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(167,139,250,.08),transparent 60%);background-attachment:fixed}
.ok{color:#5FE3A8}.no{color:#FF8A96}.wn{color:#F8C76A}
/* header */
.classbar{background:linear-gradient(90deg,rgba(20,120,80,.75),rgba(20,150,100,.85),rgba(20,120,80,.75));color:#D8FFEC;text-shadow:0 0 8px rgba(80,255,170,.5)}
.top{background:rgba(8,16,24,.72);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:0 1px 0 var(--line2)}
.brand span:first-of-type{letter-spacing:.22em;text-shadow:0 0 12px rgba(61,214,245,.45)}
.clock{color:var(--acc);text-shadow:0 0 10px rgba(61,214,245,.55)}
.ib:hover{background:rgba(61,214,245,.12)}
.ib.on{background:rgba(61,214,245,.18);color:var(--acc);box-shadow:var(--glow)}
.flow{background:rgba(8,16,24,.6);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--line2)}
.flow span.c{background:rgba(61,214,245,.12);box-shadow:inset 0 0 0 1px rgba(61,214,245,.35)}
.flow span.c b{background:var(--acc);color:#04131A;box-shadow:0 0 10px rgba(61,214,245,.6)}
.flow span.d b{background:rgba(47,209,139,.2);color:#5FE3A8}.flow span.d{color:#5FE3A8}
/* full-bleed map with floating glass panel */
.main{position:relative;display:block;height:calc(100vh - var(--hdr));overflow:hidden}
.mapcol{position:absolute;inset:0;background:#07111A;border:0;display:block}
svg.map{position:absolute;left:0;top:0;width:calc(100% - 452px);height:100%}
.mapcol::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
 background:repeating-linear-gradient(0deg,rgba(61,214,245,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 40% 45%,transparent 55%,rgba(2,6,10,.55))}
.mapcol::after{content:"";position:absolute;left:0;right:0;height:90px;top:-90px;pointer-events:none;z-index:1;
 background:linear-gradient(180deg,transparent,rgba(61,214,245,.07) 80%,rgba(61,214,245,.22));animation:scan 7s linear infinite}
@keyframes scan{to{transform:translateY(calc(100vh + 90px))}}
svg.map rect[fill="#10161D"]{fill:#07111A}
svg.map g[stroke="#19212A"]{stroke:rgba(61,214,245,.10)}
svg.map path[fill="#1E2329"]{fill:rgba(36,64,82,.55);stroke:rgba(61,214,245,.55)}
svg.map text[fill="#8F99A8"]{fill:#7FB6CC}
.chips{z-index:2}
.chip{background:rgba(6,14,20,.6);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-color:var(--line);color:#B6E9F7}
.chip.hot{box-shadow:0 0 12px rgba(255,107,122,.35)}
.ticker{position:absolute;left:12px;bottom:12px;width:calc(100% - 488px);z-index:2;border:1px solid var(--line);border-radius:6px;background:rgba(6,14,20,.62);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:430px;z-index:3;display:flex;flex-direction:column;
 background:rgba(10,20,28,.58);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
 border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.tabs{background:rgba(6,14,20,.55);border-top:1px solid var(--line2)}
.tab.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc);text-shadow:0 0 10px rgba(61,214,245,.6);background:linear-gradient(180deg,rgba(61,214,245,.12),transparent 70%)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(61,214,245,.7))}
.tab.dec{color:var(--amber)}
.body{gap:8px}
/* HUD cards: translucent with corner brackets */
.card,.act,.pcard,.hero,.box,.daily,.prof{position:relative}
.card{background:rgba(255,255,255,.025);border:1px solid var(--line2);border-radius:6px}
.card>.lbl{background:linear-gradient(90deg,rgba(61,214,245,.10),rgba(61,214,245,.02));border-bottom:1px solid var(--line2);border-radius:6px 6px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:#9FDCEB}
.card::before,.card::after,.act::before,.hero::before,.box::before,.box::after{content:"";position:absolute;width:9px;height:9px;pointer-events:none;border-color:var(--acc);border-style:solid;opacity:.85}
.card::before,.act::before,.hero::before,.box::before{top:-1px;left:-1px;border-width:1px 0 0 1px;border-radius:6px 0 0 0}
.card::after,.box::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0;border-radius:0 0 6px 0}
.lbl{font-family:var(--mono);letter-spacing:.14em}
.hint{background:linear-gradient(90deg,rgba(61,214,245,.14),rgba(61,214,245,.03));border-left:2px solid var(--acc);border-radius:4px;box-shadow:inset 0 0 0 1px var(--line2)}
.act{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:6px;transition:box-shadow .15s,border-color .15s,background .15s}
.act:hover:not(:disabled){border-color:rgba(61,214,245,.6);background:rgba(61,214,245,.07);box-shadow:0 0 16px rgba(61,214,245,.18)}
.act .ic{color:var(--acc);filter:drop-shadow(0 0 5px rgba(61,214,245,.55))}
.act.done{border-color:rgba(47,209,139,.4);background:rgba(47,209,139,.05)}.act.done .ic{color:var(--green);filter:none}
.act.go{border-color:var(--amber);box-shadow:0 0 14px rgba(245,181,68,.25)}.act .pg{background:linear-gradient(90deg,var(--amber),#FFE08A);box-shadow:0 0 8px var(--amber)}
.tri{height:5px;background:rgba(255,255,255,.06)}.tri b{box-shadow:0 0 8px currentColor}
.verdict{text-shadow:0 0 14px currentColor}
.pcard{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:6px}
.pcard:hover{border-color:rgba(61,214,245,.6);box-shadow:0 0 14px rgba(61,214,245,.15)}
.av{background:rgba(61,214,245,.12);color:var(--acc);border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
svg.graph{background:radial-gradient(circle at 50% 50%,rgba(61,214,245,.08),transparent 70%),rgba(3,10,16,.5);border:1px solid var(--line2);border-radius:6px}
.audit div{border-top-color:var(--line2)}
.flag.info{background:rgba(61,214,245,.16);color:#8FE6F8}
/* buttons */
.btn{background:rgba(255,255,255,.06);border-radius:6px;box-shadow:inset 0 0 0 1px var(--line2);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.btn:hover:not(:disabled){background:rgba(61,214,245,.10)}
.btn.pri{background:linear-gradient(180deg,#3DD6F5,#0FA3CC);color:#03141B;box-shadow:var(--glow);font-weight:700}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#6BE3FA,#1BB4DC)}
.choice{background:rgba(255,255,255,.03)}
.choice.on{box-shadow:inset 0 0 0 1px var(--acc),0 0 16px rgba(61,214,245,.2);background:rgba(61,214,245,.10)}
/* dialogs */
.modalbg{background:rgba(2,6,10,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{background:rgba(10,20,28,.82);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.5),0 0 0 1px rgba(61,214,245,.08)}
@media(min-width:761px){.sheet{border-radius:12px}}
.alert{background:linear-gradient(90deg,rgba(255,107,122,.16),rgba(255,107,122,.03));border-left-color:var(--red);border-radius:4px}
.idc{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:8px}
.idc .hd{text-shadow:0 0 6px rgba(0,0,0,.4)}
.idc .mrz{background:rgba(0,0,0,.25)}
.rec{background:rgba(255,255,255,.03);border-color:var(--line2);border-radius:6px}
.rec.locked{background:repeating-linear-gradient(135deg,rgba(245,181,68,.06) 0 8px,transparent 8px 16px);border-color:rgba(245,181,68,.4)}
/* title + end */
.title .stage{background-color:transparent;background-image:linear-gradient(rgba(61,214,245,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(61,214,245,.06) 1px,transparent 1px);background-size:36px 36px;position:relative;overflow:hidden}
.title .stage::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;pointer-events:none;
 background:conic-gradient(from 0deg,rgba(61,214,245,.18),transparent 22%,transparent);animation:sweep 6s linear infinite;
 -webkit-mask:radial-gradient(circle,#000 0 449px,transparent 450px);mask:radial-gradient(circle,#000 0 449px,transparent 450px)}
.title .stage::after{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;pointer-events:none;
 background:repeating-radial-gradient(circle,transparent 0 89px,rgba(61,214,245,.12) 89px 90px)}
@keyframes sweep{to{transform:rotate(360deg)}}
.box{z-index:1;background:rgba(10,20,28,.6);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.box .bh{background:rgba(61,214,245,.06);border-bottom:1px solid var(--line2);border-radius:10px 10px 0 0;letter-spacing:.22em}
.title h1{font-weight:700;letter-spacing:.04em;background:linear-gradient(90deg,#EAF6FB,#3DD6F5);-webkit-background-clip:text;background-clip:text;color:transparent}
.seedrow input{background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px var(--line);border-radius:6px;color:var(--acc)}
.prof,.daily{background:rgba(255,255,255,.03);border-color:var(--line2);border-radius:6px}
.lv{background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line2);border-radius:4px}
.lv.on{background:rgba(61,214,245,.18);color:var(--acc);box-shadow:var(--glow)}
.bar{background:rgba(255,255,255,.06)}.bar b{background:linear-gradient(90deg,#0FA3CC,#3DD6F5);box-shadow:0 0 10px rgba(61,214,245,.6)}
.hero{background:rgba(255,255,255,.03);border-color:var(--line2);border-radius:6px}
.grade{background:rgba(0,0,0,.3);border-radius:6px;text-shadow:0 0 18px currentColor;box-shadow:inset 0 0 0 1px var(--line)}
.cf div{background:rgba(255,255,255,.03);border-radius:4px}.cf div.you{border-color:var(--acc);box-shadow:0 0 12px rgba(61,214,245,.2)}
.end{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.mapcol::after,.title .stage::before{animation:none;display:none}}
/* ---------- phone: one fixed screen, map on top, glass panel below ---------- */
@media(max-width:760px){
 :root{--hdr:84px;--maph:min(calc(100vw * .5222 + 4px),38vh)}
 .classbar{height:14px;line-height:14px;font-size:8.5px}
 .top{height:42px;padding:0 4px}
 .clock{font-size:15px;padding:0 4px}
 .ib{min-width:32px;padding:0 6px}
 .flow{height:28px;gap:4px;justify-content:space-between}
 .flow span{padding:2px 6px}
 .flow span:not(.c){font-size:0;gap:0;padding:2px}
 .flow em{display:none}
 .main{position:fixed;top:var(--hdr);left:0;right:0;bottom:0;height:auto;overflow:hidden}
 .mapcol{position:absolute;left:0;right:0;top:0;bottom:auto;height:calc(var(--maph) + 30px)}
 svg.map{width:100%;height:var(--maph);aspect-ratio:auto}
 .ticker{left:6px;right:6px;bottom:auto;top:calc(var(--maph) + 2px);width:auto;padding:4px 8px;font-size:11px;min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px}
 .chips{top:4px;left:4px;right:4px;gap:3px}
 .chip{font-size:9.5px;padding:1px 5px}
 .panel{left:0;right:0;bottom:0;top:calc(var(--maph) + 32px);width:auto;border-radius:14px 14px 0 0;border-bottom:0;display:flex}
 .panel::before{content:"";position:absolute;top:5px;left:50%;width:36px;height:3px;margin-left:-18px;border-radius:2px;background:var(--line);z-index:2}
 .body{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 8px 8px;gap:6px}
 .tabs{position:static;padding-bottom:env(safe-area-inset-bottom)}
 .tab{padding:6px 2px 5px;font-size:9.5px;gap:2px}
 .hint{padding:6px 8px;font-size:12px;line-height:1.35;gap:6px}
 .hint svg{width:14px;height:14px;margin-top:1px}
 .acts{gap:5px}
 .act{min-height:0;padding:7px 8px 8px}
 .act .ic{height:16px}.act .ic svg{width:16px;height:16px}
 .act .nm{font-size:13px}
 .act .ds{font-size:11px;line-height:1.3}
 .card{padding:7px 9px 9px}
 .card>.lbl{margin:-7px -9px 7px;padding:5px 9px;font-size:9.5px}
 .verdict{font-size:14.5px}
 .card .sm{font-size:11.5px}
 .legend{font-size:9.5px;margin-top:4px}
 .kv2{gap:4px 10px}
 .pcard{padding:6px 8px;grid-template-columns:34px 1fr auto}
 .av{width:34px;height:34px}
 svg.graph{max-height:min(150px,22vh)}
}
/* compact vessel fields */
.kv2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 12px;font-size:13px}
.kv2 small{display:block;font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kv2 span{display:block;min-width:0;overflow-wrap:anywhere}
.act.wide{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.act.wide .ic{grid-row:1/3;height:auto}
@media(max-width:760px){.kv2{font-size:12px;gap:3px 8px}.kv2 small{font-size:8.5px}.card .src{font-size:10px}}

/* ================= v9 research pass: legibility, access, Low FX ================= */
:root{--glass:blur(12px) saturate(140%);--mute:#B4C7D3;--dim:#8BA3B3;--focus:#FFE08A}
/* glass that carries text must be near-opaque (>=.8) */
.panel{background:rgba(7,15,22,.86)}
.sheet{background:rgba(7,15,22,.93)}
.top{background:rgba(6,13,20,.88)}.flow{background:rgba(6,13,20,.82)}
.chip{background:rgba(4,11,17,.82)}.ticker{background:rgba(4,11,17,.84)}
.box{background:rgba(7,15,22,.84)}
.card{background:rgba(255,255,255,.035)}
/* glow only on decoration, never on reading text */
.verdict,.clock,.tab.on,.brand span:first-of-type,.grade{text-shadow:none}
.verdict .pct{font:600 .82em var(--mono);color:var(--ink);opacity:.85;margin-left:4px}
.clock,.grade,.cf div b,.pcard .mt,.match>b,.audit div,.kv2,.legend{font-variant-numeric:tabular-nums}
/* type scale: labels >=11px, body >=12px */
.lbl,.card>.lbl{font-size:11.5px;letter-spacing:.1em}
.tab{font-size:11.5px;min-height:52px;justify-content:center}
.chip{font-size:11px}
.legend{font-size:11.5px;letter-spacing:.03em;text-transform:none;gap:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.kv2 small{font-size:10.5px;letter-spacing:.08em}
.act .ds{font-size:12px}
.src{font-size:11px}
.idc .f{font-size:11px}
/* 10-icon frequency array + shape-coded glyphs (colour is never the only cue) */
.ten{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:9px;max-width:240px}
.gl{display:inline-block;width:10px;height:10px;background:var(--c,currentColor);flex:none}
.ten .gl{width:100%;height:auto;aspect-ratio:1}
.gD{border-radius:50%}                         /* distress: circle */
.gS{clip-path:polygon(50% 0,100% 100%,0 100%)} /* criminal: triangle */
.gL{border-radius:2px}                         /* legitimate: square */
.legend .gl{background:currentColor}
/* focus + touch */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
button:focus:not(:focus-visible){outline:none}
.btn{min-height:44px}
.ib{min-width:40px;min-height:40px}
.fxb{font:700 11px var(--mono);letter-spacing:.06em;min-width:52px}
.ib[aria-pressed="true"].fxb{color:var(--acc)}
/* calmer motion: slower sweep, fewer layers */
.mapcol::after{animation-duration:11s;opacity:.7}
/* Low FX: solid panels, no blur, no scanlines/sweeps (also the WCAG 2.2.2 pause control) */
html.lowfx *,html.lowfx *::before,html.lowfx *::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lowfx .mapcol::after,html.lowfx .title .stage::before{animation:none;display:none}
html.lowfx .mapcol::before{background:none}
html.lowfx .panel,html.lowfx .sheet,html.lowfx .box{background:#0A141C}
html.lowfx .top,html.lowfx .flow,html.lowfx .chip,html.lowfx .ticker{background:#08111A}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 .panel,.sheet,.box{background:#0A141C}.top,.flow,.chip,.ticker{background:#08111A}}
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){
 *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
 .panel,.sheet,.box{background:#0A141C}.top,.flow,.chip,.ticker{background:#08111A}
 .mapcol::before{background:none}:root{--line:rgba(140,215,245,.45);--line2:rgba(140,215,245,.3)}}
@media(max-width:760px){
 :root{--hdr:86px}
 .top{height:44px}
 .ib{min-width:40px;min-height:40px}
 .tab{font-size:10.5px;min-height:46px;padding:4px 2px}
 .chip{font-size:10.5px;padding:2px 6px}
 .ticker{font-size:11.5px}
 .card>.lbl{font-size:10.5px}
 .legend{font-size:10.5px}
 .kv2 small{font-size:10px}
 .act .ds{font-size:11.5px}
 .ten{gap:3px;margin-top:7px}
 .classbar{font-size:9px}
}
@media(max-width:760px) and (max-height:760px){svg.graph{max-height:min(110px,16vh)}}

/* hold-to-confirm fill */
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold span{position:relative;z-index:1}
.hold::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.45);transform:scaleX(0);transform-origin:left;pointer-events:none}
.hold.arming::after{transform:scaleX(1);transition:transform .7s linear}
/* report P1: label floor 12px desktop, 11px phone */
.lbl,.card>.lbl{font-size:12px}
@media(max-width:760px){.card>.lbl,.lbl{font-size:11px}.legend{font-size:11px}.tab{font-size:11px}.chip{font-size:11px}}

.seclbl{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-top:14px}
/* v11: daily brief, uplink ladder, streak */
.cal button,.cal i{flex:1;font:700 11px/26px var(--mono);text-align:center;border-radius:2px;background:var(--panel3);color:var(--dim);font-style:normal;border:0;padding:0;min-height:30px}
.cal button{cursor:pointer}.cal button:hover{color:var(--ink)}.cal .now{box-shadow:inset 0 0 0 1px var(--amber)}
.cal button.g{background:rgba(35,133,81,.3);color:#72CA9B}.cal button.b{background:rgba(205,66,70,.25);color:#FA999C}
.daily .streak{display:block;margin-top:4px;color:var(--amber)}.xs{display:block;font-size:11px;margin-top:4px}
.how{margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--mute)}.how li{margin:2px 0}
.upl .tier{color:var(--amber);font-weight:700}
.upw{position:relative;height:250px;margin:10px 0 12px 74px;border-left:2px solid var(--line);background:linear-gradient(to top,rgba(86,180,233,.10),rgba(5,9,13,0) 45%,rgba(240,228,66,.06))}
.um{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line2)}
.um span{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);font:600 11px var(--mono);color:var(--dim);white-space:nowrap}
.um em{position:absolute;left:10px;transform:translateY(-50%);font-style:normal;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 10px)}
.um.on{border-top-color:rgba(86,180,233,.45)}.um.on em,.um.on span{animation:lit .4s ease-out var(--d) forwards}
@keyframes lit{to{color:var(--ink)}}
.ume{position:absolute;left:-7px;right:0;bottom:0;height:0;border-top:2px solid var(--amber);z-index:2;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) .3s forwards}
.ume::before{content:'';position:absolute;left:-1px;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px rgba(245,181,68,.8)}
.ume b{position:absolute;right:0;top:-22px;font:700 12px var(--mono);color:var(--amber);background:var(--panel2);padding:1px 4px;border-radius:3px}
@keyframes rise{to{bottom:var(--to)}}
html.lowfx .ume,html.lowfx .um.on em,html.lowfx .um.on span{animation:none}html.lowfx .ume{bottom:var(--to)}html.lowfx .um.on em,html.lowfx .um.on span{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.ume{animation:none!important;bottom:var(--to)}.um.on em,.um.on span{animation:none!important;color:var(--ink)}}
@media (max-width:420px){.upw{margin-left:62px}.um em{font-size:11px}}

/* v13: conditions */
.envs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.envc{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 8px;border:1px solid var(--line2);border-radius:4px;color:var(--dim);background:rgba(255,255,255,.02)}
.envc.on{color:var(--ink);border-color:rgba(86,180,233,.5)}

:root{
 --bg:#0b1220;--panel:#131d2e;--panel2:#1b2840;--panel3:#24344f;--line:#3a5072;--line2:#2a3b57;--edge:#05080f;
 --ink:#eef3ea;--mute:#b3c1d0;--dim:#8597ad;
 --acc:#5fd3e6;--acc2:#2a8fa6;--green:#7fd37a;--amber:#ffc46b;--red:#ff6a5a;--violet:#c9a8ff;--focus:#ffe066;
 --pf:"Watchkeeper",var(--mono);
 --glass:none;--glow:none;
 --bev:inset -3px -3px 0 rgba(0,0,0,.38),inset 3px 3px 0 rgba(255,255,255,.10);
 --drop:4px 4px 0 rgba(0,0,0,.55);
}
html,body{background:var(--bg)}
body{background-image:none}
*,*::before,*::after{border-radius:0!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;text-shadow:none!important}
svg.px,svg.i{image-rendering:pixelated;shape-rendering:crispEdges;filter:none!important}
/* pixel type for chrome; body copy stays a plain readable sans */
.classbar,.brand span,.clock,.flow span,.chip,.tab,.lbl,.card>.lbl,.btn,.act .nm,.title h1,.hero h1,.box .bh,.seclbl,.kv2 small,.verdict,.grade,
.cal button,.cal i,.lv,.envc,.flag,.ticker,.legend,.hero .meta,.upl .tier,.ib,.fxb,.daily .dt b,.steps li::before,.prof .rk,.cf div b,.um span,.ume b,.seedrow input,.pcard .mt,.match>b{
 font-family:var(--pf)!important;font-weight:400!important;letter-spacing:0!important;-webkit-font-smoothing:none;font-smooth:never}
.lbl,.card>.lbl,.chip,.tab,.btn,.act .nm,.box .bh,.seclbl,.kv2 small,.legend,.hero .meta,.envc,.flag,.lv,.classbar,.ib,.fxb,.daily .dt b,.prof .rk{text-transform:uppercase}
.lbl,.card>.lbl,.seclbl,.kv2 small,.hero .meta,.legend,.envc,.flag{font-size:16px!important;line-height:1.25}
.chip,.ticker,.tab,.cal button,.cal i{font-size:16px!important}
.btn,.act .nm,.box .bh,.lv,.ib,.fxb,.daily .dt b,.prof .rk{font-size:16px!important;line-height:1.25}
.verdict{font-size:24px!important;line-height:1.2}.verdict .pct{font:inherit!important;font-size:inherit!important}
.title h1{font-size:40px!important;line-height:1.1;background:none!important;-webkit-background-clip:border-box!important;color:var(--ink)!important;margin:6px 0 12px}
.title h1 span,.title h1 b{color:var(--acc)}
.hero h1{font-size:24px!important;line-height:1.2}
.grade{font-size:48px!important;line-height:1;padding:8px 12px!important;background:var(--edge)!important;box-shadow:var(--bev),0 0 0 2px var(--line)!important}
.clock{font-size:24px!important;color:var(--acc)!important}
.classbar{background:#1f6b45!important;color:#d9ffe9!important;font-size:8px!important;letter-spacing:0!important;box-shadow:0 2px 0 var(--edge)}
/* frames: flat fills, 2px pixel borders, hard drop shadows, no glass */
.top,.flow{background:var(--panel)!important;border-bottom:2px solid var(--edge)!important;box-shadow:none!important}
.panel{background:var(--panel)!important;border:2px solid var(--line)!important;box-shadow:0 0 0 2px var(--edge),var(--drop)!important}
.box,.sheet{background:var(--panel)!important;border:2px solid var(--line)!important;box-shadow:0 0 0 2px var(--edge),6px 6px 0 rgba(0,0,0,.55)!important}
.card,.act,.pcard,.hero,.daily,.prof,.rec,.idc,.envb{background:var(--panel2)!important;border:2px solid var(--line2)!important;box-shadow:var(--bev)!important}
.card>.lbl{background:var(--panel3)!important;border-bottom:2px solid var(--edge)!important;color:var(--acc)!important}
.daily{border-left:6px solid var(--amber)!important}
.envb{border-left:6px solid var(--acc)!important}
.card::before,.card::after,.act::before,.hero::before,.box::before,.box::after{width:6px!important;height:6px!important;border-width:0!important;background:var(--acc);opacity:1!important;top:-2px;left:-2px}
.card::after,.box::after{top:auto;left:auto;bottom:-2px;right:-2px}
.hint{background:var(--panel3)!important;border-left:6px solid var(--acc)!important;box-shadow:none!important}
.alert{background:#3a1c22!important;border-left:6px solid var(--red)!important}
/* buttons: chunky bevel, press = shift down-right */
.btn,.lv,.ib,.choice,.cal button{border:0!important;box-shadow:var(--bev),0 0 0 2px var(--edge)!important;background:var(--panel3)!important;transition:none!important}
.btn:hover:not(:disabled),.lv:hover:not(:disabled),.choice:hover{background:#2d4061!important}
.btn:active:not(:disabled),.act:active:not(:disabled),.lv:active,.choice:active,.cal button:active{transform:translate(2px,2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.38),0 0 0 2px var(--edge)!important}
.btn.pri{background:var(--acc)!important;color:#06121a!important;box-shadow:inset -3px -3px 0 var(--acc2),inset 3px 3px 0 #bff4fb,0 0 0 2px var(--edge)!important}
.btn.pri:hover:not(:disabled){background:#86e2f0!important}
.lv.on,.ib.on,.choice.on{background:var(--acc2)!important;color:#fff!important}
.ib{background:transparent!important;box-shadow:none!important}.ib:hover{background:var(--panel3)!important}
.act:hover:not(:disabled){border-color:var(--acc)!important;background:#22324d!important}
.act .ic{color:var(--acc)}
.act.done{border-color:#3f7a4a!important}.act.done .ic{color:var(--green)}
.act.go{border-color:var(--amber)!important}
.act .pg{background:var(--amber)!important;box-shadow:none!important}
.pcard:hover{border-color:var(--acc)!important}
.av{background:var(--panel3)!important;box-shadow:0 0 0 2px var(--edge)!important;overflow:hidden}
.av svg,.idc .ph svg{width:100%;height:100%;display:block}
.choice{font-family:inherit!important;text-transform:none!important;font-size:14px!important;line-height:1.35!important}
.choice b{font-family:var(--pf)!important;font-weight:400!important;font-size:16px!important;text-transform:uppercase}
.choice small{font-size:13px}
.sheet h2,.sheet h3{font-family:var(--pf);font-weight:400;text-transform:uppercase;font-size:24px;letter-spacing:0}
@keyframes twk{0%,64%{opacity:0}65%,84%{opacity:1}85%,100%{opacity:0}}
svg.map .spk{opacity:0;animation:twk 3s steps(1,end) infinite}
svg.map .surf{animation-duration:1.5s}
@keyframes blk{0%,49%{opacity:1}50%,100%{opacity:.15}}
svg.map .blk{animation:blk 1.2s steps(1,end) infinite}
html.lowfx svg.map .spk{animation:none;opacity:0}html.lowfx svg.map .blk{animation:none}
@media (prefers-reduced-motion:reduce){svg.map .spk{animation:none;opacity:0}svg.map .blk{animation:none}}
/* bars: segmented blocks */
.tri,.bar{height:12px!important;background:var(--edge)!important;border:2px solid var(--edge);position:relative;gap:2px!important}
.tri b,.bar b{box-shadow:none!important}
.tri::after,.bar::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 8px,var(--edge) 8px 10px)}
.bar b{background:var(--acc)!important}
.match i{height:10px!important;background:var(--edge)!important}
/* tabs + flow + chips + ticker */
.tabs{background:var(--panel)!important;border-top:2px solid var(--edge)!important}
.tab.on{background:var(--panel3)!important;color:var(--acc)!important;box-shadow:inset 0 4px 0 var(--acc)!important}
.tab.on svg{filter:none!important}
.flow span.c{background:var(--panel3)!important;box-shadow:0 0 0 2px var(--acc)!important}
.flow span.c b{background:var(--acc)!important;color:#06121a!important;box-shadow:none!important}
.flow span b{font-family:var(--pf)!important;font-weight:400!important;font-size:16px!important;width:20px!important;height:20px!important}
.chip{background:rgba(11,18,32,.92)!important;border:2px solid var(--edge)!important;box-shadow:inset 0 0 0 2px var(--line2)!important;color:var(--ink)!important;padding:2px 8px!important;line-height:20px}
.chip.hot{background:#5a1f22!important;color:#ffd0c8!important}
.ticker{background:rgba(11,18,32,.94)!important;border:2px solid var(--edge)!important;box-shadow:inset 0 0 0 2px var(--line2)!important}
/* map: pixel art, no scanlines or sweeps */
.mapcol{background:#0b1a2b!important}
.mapcol::before,.mapcol::after{display:none!important;animation:none!important}
svg.map image.pxi{image-rendering:pixelated;image-rendering:crisp-edges}
svg.map text.pxt{font-family:"Watchkeeper",monospace;paint-order:stroke;stroke:#0b1220;stroke-width:4px;stroke-linejoin:miter;letter-spacing:0}
svg.graph{shape-rendering:crispEdges;background:var(--edge)!important;border:2px solid var(--line2)!important}
svg.graph text{font-family:"Watchkeeper",monospace!important;font-size:16px}
/* title: pixel sea under the panel */
.title .stage{background:#0f2236 var(--seabg) center/2440px 1860px no-repeat!important;image-rendering:pixelated}
.title .stage::before,.title .stage::after{display:none!important;animation:none!important}
.seedrow input{background:var(--edge)!important;box-shadow:inset 0 0 0 2px var(--line)!important;color:var(--acc)!important;font-size:16px!important}
.envc{background:var(--panel2)!important;border:2px solid var(--line2)!important}
.envc.on{border-color:var(--acc)!important}
.cal i{background:var(--panel3)!important}
.cal .now{box-shadow:0 0 0 2px var(--amber)!important}
.flag{padding:1px 6px!important}
.ume::before{width:12px;height:12px;box-shadow:none!important}
.ume b{background:var(--edge)!important}
.upw{background:var(--edge)!important;border-left:4px solid var(--line)!important}
:focus-visible{outline:3px solid var(--focus)!important;outline-offset:2px}
@media(max-width:760px){
 .chip{font-size:12px!important;padding:0 6px!important;line-height:18px}
 .ticker{font-size:12px!important}
 .tab{font-size:12px!important}
 .lbl,.card>.lbl,.seclbl,.kv2 small,.legend,.hero .meta,.envc,.flag{font-size:12px!important}
 .act .nm,.btn,.daily .dt b,.prof .rk{font-size:16px!important}
 .clock{font-size:16px!important}
 .verdict{font-size:16px!important}
 .title h1{font-size:32px!important}
 .panel{border-bottom:0!important}
 .panel::before{height:4px!important;background:var(--line)!important}
}

/* v16 one-screen title + pinned actions */
.btn.big{min-height:56px;font-size:20px!important;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.go{padding:12px 16px 14px;border-top:2px solid var(--edge);background:var(--panel)}
.more{margin-top:12px;border-top:2px solid var(--line2);padding-top:8px}
.more>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-family:var(--pf);text-transform:uppercase;font-size:16px;color:var(--acc);list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"+";margin-left:auto;font-size:20px}.more[open]>summary::after{content:"\2212"}
.endbar{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -10px 14px var(--bg)}
.endbar .btn{flex:1}.endbar .btn:not(.big){min-height:56px;flex:0 0 38%}
.title{height:100vh;height:100dvh;min-height:0}
.title .stage{min-height:0}
.title .box{display:flex;flex-direction:column;max-height:100%;min-height:0}
.title .bb{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;min-height:0}
@media(max-width:760px){
 .title .stage{padding:8px;align-items:stretch}
 .title .bb{padding:12px 14px}
 .title h1{font-size:30px!important;margin:0 0 8px!important}
 .title .bb>p:first-of-type{font-size:15px;line-height:1.4;margin:0}
 .daily{margin-top:10px;padding:8px 10px}
 .go{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
 .end{padding-bottom:0}
 .hero h1{font-size:20px!important}
 .grade{font-size:40px!important}
}
@media(max-width:760px) and (max-height:700px){
 .title h1{font-size:26px!important}
 .title .bb>p:first-of-type{font-size:14px}
 .daily .xs{display:none}
}

/* v18 turn-based watch clock */
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.clock small{font-size:12px!important;color:var(--dim);text-transform:uppercase;margin-bottom:2px}
.clock.low{color:var(--amber)!important}.clock.crit{color:var(--red)!important}
.clock.run{animation:clk 1s steps(2) infinite}@keyframes clk{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.clock.run{animation:none}}
html.lowfx .clock.run{animation:none}
@media(max-width:760px){.clock small{font-size:9px!important}}

/* v20 accounts */
#auth{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden}
#auth[hidden]{display:none}
body.authon{overflow:hidden}
#auth .title{height:100vh;height:100dvh;min-height:0}
#auth .stage{padding:8px}
#auth .box{max-height:100%;display:flex;flex-direction:column}
#auth .bb{overflow-y:auto;min-height:0}
.af{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.af label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.af input{min-height:48px;background:var(--edge,#05080f);border:0;box-shadow:inset 0 0 0 2px var(--line);border-radius:4px;padding:10px 12px;color:var(--ink);font:600 16px var(--mono,monospace)}
.af input:focus{outline:3px solid var(--focus);outline-offset:1px}
.aerr{min-height:1.3em;margin:0!important;color:var(--amber)!important;font-size:14px}
.atabs{display:flex;gap:4px;margin-top:6px}
.atabs button{flex:1;min-height:44px;background:transparent;border:0;border-bottom:3px solid var(--line2);color:var(--mute);font:inherit;font-family:var(--pf,inherit);text-transform:uppercase;cursor:pointer}
.atabs button.on{border-color:var(--acc);color:var(--acc)}
.aor{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--dim);font-size:13px}.aor::before,.aor::after{content:"";flex:1;height:2px;background:var(--line2)}
.alink{display:block;margin:10px auto 0;min-height:44px;background:none;border:0;color:var(--acc);text-decoration:underline;font:inherit;cursor:pointer}
.acct{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;color:var(--mute)}
.acct span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.acct .btn{flex:none;min-height:44px;padding:8px 12px;font-size:14px}
.acct .onl{flex:none;font-style:normal;display:flex;align-items:center;gap:5px;color:var(--green);font-size:13px;white-space:nowrap}.acct .onl i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.astats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.astats div{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line2);padding:10px;display:flex;flex-direction:column}
.astats b{font-size:28px;color:var(--acc);line-height:1}.astats small{color:var(--dim);font-size:12px;text-transform:uppercase;margin-top:4px}
.alog{list-style:none;margin:6px 0;padding:0;max-height:38vh;overflow-y:auto}
.alog li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:14px}
.alog time{color:var(--dim);white-space:nowrap}
.intel{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.intel span{display:flex;align-items:center;gap:3px;padding:3px 6px;border:1px solid var(--line2);border-radius:3px;font-size:12px;color:var(--dim)}

}

const dailyNo = day => Math.round((Date.parse(day) - Date.parse('2026-01-01')) / 864e5) + 1;
function recordCase(G){
  if (G.recorded) return; G.recorded = true;
  const sc = score(G), o = OUT[G.res.kind], before = lvlOf(CR.xp), lvlBefore = CR.lvlMax;
  const gain = Math.round(XPG[sc.grade] * (1 + 0.1*(G.lvl-1))) + (CR.bests[G.truth] ? 0 : 50);
  CR.xp += gain; CR.cases++; sessionCases++;
  const order = 'ABCDF';
  if (!CR.bests[G.truth] || order.indexOf(sc.grade) < order.indexOf(CR.bests[G.truth])) CR.bests[G.truth] = sc.grade;
  CR.outs[G.res.kind] = (CR.outs[G.res.kind] || 0) + 1;
  CR.tel.dec[G.decision || 'none'] = (CR.tel.dec[G.decision || 'none'] || 0) + 1;
  CR.tel.grade[sc.grade] = (CR.tel.grade[sc.grade] || 0) + 1;
  if (G.lvl === CR.lvlMax && G.lvl < 5 && 'AB'.includes(sc.grade)) CR.lvlMax++;
  newAch = [];
  const give = id => { if (!CR.ach[id]){ CR.ach[id] = today(); newAch.push(id); } };
  recordDaily(G, sc, G.decision ? PAY[G.decision][G.truth] : 0, give);
  CR.seenE = CR.seenE || {}; CR.seenS = CR.seenS || {}; CR.seenE[G.sc.E] = 1; CR.seenS[G.sc.story] = 1;
  if (ENV_ORDER.every(k => CR.seenE[k])) give('weather');
  if (STORY_KEYS.every(k => CR.seenS[k])) give('files');
  if (sc.needle && sc.grade === 'A') give('needle');
  give('first');
  if (['D','S','L'].every(T => CR.bests[T] && CR.bests[T] !== 'F')) give('all3');
  if (G.res.kind === 'saved') give('nobody');

  if (m.type === 'idcards'){

  }
  if (m.type === 'unlock') h = `<h2>${I('lock',18)} Restricted records</h2>

    <div class="row"><button class="btn" data-act="cancel">Cancel</button></div>`;
  if (m.type === 'node'){
    const n = C.graph.find(x => x.id === m.id), hidden = C.graph.filter(x => x.parent === n.id && !G.graph.includes(x.id));

      ${n.kind === 'vessel' ? `<div class="kv"><span>Type</span><span>${esc(v.type)}</span><span>Flag</span><span>${esc(v.flag)}</span><span>Owner</span><span>${esc(v.owner)}</span></div>` : `<p>${esc(n.text)}</p>`}
      ${n.flag ? `<p><span class="flag ${n.flag}">${n.flag==='bad'?'red flag':n.flag==='warn'?'worth a look':'supports a story'}</span></p>` : ''}
      ${n.kind === 'person' ? '<p class="mute sm">Being linked to something is not evidence of wrongdoing.</p>' : ''}
      <div class="row"><button class="btn" data-act="cancel">Close</button>${hidden.length ? `<button class="btn pri" data-act="task" data-id="expand" data-arg="${n.id}" ${G.busy||G.closed||tooDear(G,'expand')?'disabled':''}>${tooDear(G,'expand') ? 'Not enough watch time' : `Search around (${hidden.length}) · ${taskMin('expand')} min`}</button>` : ''}</div>`;
  }
  if (m.type === 'decide'){
    const p = probs(G);
    h = `<h2>Decide</h2>${m.forced ? '<p class="wn sm"><b>Your watch time is up.</b> Make the call now.</p>' : ''}<p class="mute sm">One decision. ${blind(G) ? 'No assessment at this clearance.' : `Lattice says: <b style="color:${HC[best(p)]}">${HN[best(p)]} ${Math.round(p[best(p)]*100)}%</b>`} from ${G.findings.length} piece${G.findings.length===1?'':'s'} of evidence.</p>
      ${Object.keys(DEC).map(k => `<button class="btn choice ${m.d===k?'on':''}" data-act="pickD" data-d="${k}"><b>${I(DEC[k].icon)} ${DEC[k].name}</b> <span class="mute">· ${DEC[k].sub}</span><small>${DEC[k].text}</small></button>`).join('')}
      ${m.d === 'board' ? `<div class="lbl" style="margin-top:12px"><span>Legal basis</span></div>${Object.keys(BASIS).map(k => `<button class="btn choice ${m.b===k?'on':''}" data-act="pickB" data-b="${k}"><b>${BASIS[k].name}</b><small>${BASIS[k].sub}</small></button>`).join('')}` : ''}
      ${!G.findings.length ? '<p class="wn sm">You haven’t gathered any evidence yet.</p>' : ''}

  }
  if (m.type === 'mayday'){ const M = G.sc.may, free = G.units.lifeboat.st === 'base' && !spent(G, 'lifeboat');
    h = `<div class="alert"><b>${I('alert',14)} MAYDAY RELAY · ${hhmm(G.t)}</b><div>Coast radio relays a call: ${esc(M.boat)} reports a person in the water, 14 km north of the harbour.</div></div>

    ${G.mayV ? `<p class="sm ${G.mayV==='fake'?'no':G.mayV==='real'?'ok':'wn'}" style="margin:8px 0"><b>Verification:</b> ${G.mayV==='fake' ? 'Nobody by that name is registered, and the call came from near K-7’s course. It looks like a decoy.' : G.mayV==='real' ? 'Call sign checks out and the DSC position is consistent. The call is genuine.' : 'Inconclusive. You need a Movement fix and a radio contact with K-7 to cross-check the call.'}</p>`
      : `<button class="btn choice" data-act="mayday" data-v="verify" ${timeLeft(G) >= 2 ? '' : 'disabled'}><b>${I('search')} Verify the call sign</b><small>2 min · only conclusive if you have a Movement check and a radio contact</small></button>`}
    <button class="btn choice" data-act="mayday" data-v="stay"><b>${I('eye')} Log it, stay on K-7</b><small>Passed to the next station, 40 minutes away.</small></button>`; }
  if (m.type === 'achs') h = `<h2>${I('check',18)} Badges</h2>${Object.keys(ACH).map(id => `<div class="ach" style="${CR.ach[id]?'':'opacity:.45'}">${CR.ach[id]?I('check',14):I('lock',14)}<span><b>${ACH[id][0]}</b> · ${ACH[id][1]}${CR.ach[id]?` <span class="mute">${CR.ach[id]}</span>`:''}</span></div>`).join('')}<div class="row"><button class="btn" data-act="cancel">Close</button></div>`;
  if (m.type === 'reset') h = `<h2>Start over?</h2><p><b>Reset case</b> deletes this case only. <b>Reset everything</b> also wipes your rank, clearances, archive and badges.</p>
    <div class="row"><button class="btn" data-act="cancel">Cancel</button><button class="btn red" data-act="doReset">Reset case</button></div><div class="row" style="margin-top:6px"><button class="btn red" data-act="doResetAll">Reset everything</button></div>`;
  box.innerHTML = `<div class="modalbg" data-act="${['alert','help','idcards'].includes(m.type)?'close':'cancel'}"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
}

// ---------- debrief ----------
const OUT = {
  saved:{g:true, h:'Everyone was rescued'}, partial:{g:false, h:'Only some people were rescued'}, lost:{g:false, h:'The boat sank. Nobody was saved'},
  intercepted:{g:true, h:'Smugglers caught at sea'}, dumped:{g:false, h:'Boarded, but the cargo went over the side'}, followed:{g:true, h:'Smugglers arrested on the beach'}, landed:{g:false, h:'The smugglers got away'},
  clear:{g:true, h:'The boat went on its way safely'}, incident:{g:false, h:'You boarded an innocent boat'}
};
function judgement(G, d){ const p = probs(G); return HK.reduce((a,T) => a + p[T]*PAY[d][T], 0); }
function missedClue(G){
  // the single most telling clue the player never collected (honest "what you missed")
  const C = G.sc.C, ti = HK.indexOf(G.truth), have = new Set(G.findings.map(f => f.key)), cand = [];
  const add = (key, tool, title, w) => { if (!have.has(key) && w) cand.push({tool, title, r: w[ti] / Math.max(...w.filter((_,i)=>i!==ti))}); };
  add('track', 'Replay track', trackResult(G)[0], trackResult(G)[2]); add('drift', 'Drift check', C.drift[0], C.drift[2]); add('hail', 'Radio call', hailResult(G)[0], hailResult(G)[2]);
  add('registry', 'Registry check', C.registry[0], C.registry[2]); if (envOf(G).drone !== 'grounded') add('drone', 'Drone', droneResult(G)[0], droneResult(G)[2]);
  if (envOf(G).cams) add('cams', 'Port cameras', C.cams[0], C.cams[2]);
  C.graph.forEach(n => n.w && add('g-'+n.id, 'Search around', n.label+': '+n.text, n.w));
  if (facesOK(G)) C.people.forEach((p,i) => !p.crowd && p.same && add('rec-'+i, 'Police records', p.n+': '+p.tag, p.w));
  return cand.filter(c => c.r > 1.5).sort((a,b) => b.r - a.r)[0] || null;
}
function score(G){
  const L = []; let s = {saved:45, partial:20, lost:0, intercepted:45, dumped:22, followed:35, landed:0, clear:45, incident:5}[G.res.kind];
  L.push(['Outcome', s]);
  const J = G.decision ? (G.judge ?? judgement(G, G.decision)) : 0, callPts = Math.round(J * 0.2);
  s += callPts; L.push([J >= 70 ? 'Sound call for the evidence you had' : J >= 45 ? 'Shaky call for the evidence you had' : 'The evidence didn’t support this call', callPts]);
  let idp = 0; G.sc.C.people.forEach((p,i) => { if (p.crowd || !G.ids[i]) return; idp += ((G.ids[i]==='yes') === p.same) ? 5 : -8; });
  s += idp; L.push(['Identity matches resolved', idp]);
  if (facesOK(G)){ const acc = G.override ? -10 : G.unlocked ? 10 : 0; s += acc; L.push([G.override ? 'Records opened by override' : G.unlocked ? 'Records opened with a logged purpose' : 'Records never opened', acc]); }
  else { const n = G.findings.length, d = n >= 4 ? 15 : n >= 3 ? 8 : 0; s += d; L.push(['No faces to match: built the picture from other sources', d]); }
  const ev = G.findings.length >= 3 ? 10 : 0; s += ev; L.push([ev ? 'Gathered evidence before acting' : 'Acted on little evidence', ev]);
  const left = G.decidedAt != null ? Math.max(0, budget(G) - G.decidedAt) : 0, tb = Math.round(left / budget(G) * 10);
  if (tb > 0){ s += tb; L.push(['Decided with '+Math.floor(left)+' min of watch left', tb]); }
  if (G.mayAsk && G.may){ const M = G.sc.may, v = G.may === 'sent' ? (M.real ? 8 : -3) : (M.real ? -12 : 5); s += v;
    L.push([G.may === 'sent' ? (M.real ? 'Mayday answered: the lifeboat pulled someone out' : 'Lifeboat sent to a false alarm') : (M.real ? 'Mayday ignored: it was real' : 'Mayday was a hoax: right to stay on K-7'), v]); }
  if (G.truth === 'S' && G.alerted){ s -= 5; L.push([G.alerted.charAt(0).toUpperCase() + G.alerted.slice(1)+' pushed escalation to '+G.esc+' and warned the smugglers', -5]); }
  if (G.decision === 'board'){ const b = G.basisOK ? 5 : -15; s += b; L.push([G.basisOK ? 'Boarding had a valid legal basis' : 'Boarding had no valid legal basis', b]); }
  const needle = !!G.decision && againstOdds(envOf(G).prior, G.truth, PAY[G.decision][G.truth]);
  if (needle){ s += 8; L.push(['Against the odds: the less likely answer, called right', 8]); }
  s = clamp(s, 0, 100);
  return {s, L, needle, grade: s >= 85 ? 'A' : s >= 70 ? 'B' : s >= 50 ? 'C' : s >= 30 ? 'D' : 'F'};
}
function debriefExtra(G, sc, p, lb){
  const J = G.decision ? (G.judge ?? judgement(G, G.decision)) : 0, good = OUT[G.res.kind].g;
  let luck = '';
  if (!good && J >= 70) luck = `<p class="sm" style="margin-top:6px"><span class="flag info">good read, bad luck</span> Your evidence really did point this way. The grade keeps that.</p>`;
  else if (good && J < 45) luck = `<p class="sm" style="margin-top:6px"><span class="flag warn">lucky</span> It worked out, but your evidence didn’t support this call.</p>`;
  const nextG = 'FDCBA'['FDCBA'.indexOf(sc.grade)+1];
  const gap = nextG ? GRADE_MIN[nextG] - sc.s : 0;
  const miss = missedClue(G);
  return `<div class="card"><div class="lbl"><span>Your read of the evidence</span><span>${G.findings.length} clues</span></div>
    <p>${G.findings.length ? `Your evidence pointed to <b style="color:${HC[lb]}">${HN[lb]} at ${Math.round(p[lb]*100)}%</b>.` : `You decided with no evidence, on the base rate alone.`} The truth was <b style="color:${HC[G.truth]}">${HN[G.truth]}</b>.</p>${luck}
    ${gap ? `<p class="mute sm" style="margin-top:6px">${gap} point${gap>1?'s':''} short of ${nextG}.</p>` : ''}
    ${miss ? `<div class="ev" style="margin-top:10px;border-color:var(--amber)"><b>Missed: ${esc(miss.tool)}</b><span>${esc(miss.title)}</span></div>` : '<p class="mute sm" style="margin-top:6px">You found every telling clue.</p>'}</div>`;
}
function callsCard(G){
  const cf = Object.keys(DEC).map(k => `<div class="${G.decision===k?'you':''} ${PAY[k][G.truth]===100?'best':''}"><b>${letter(PAY[k][G.truth])}</b>${DEC[k].name}${G.decision===k?' · you':''}</div>`).join('');
  return `<div class="card"><div class="lbl"><span>How each call would have ended</span></div><div class="cf">${cf}</div></div>`;
}
function careerCard(G){
  const M = G.meta; if (!M) return '';
  const L = M.after, lo = xpFor(L), hi = xpFor(L+1), pct = Math.round((M.xpAfter - lo) / (hi - lo) * 100);
  const goal = M.unlocked ? `<p class="ok sm" style="margin-top:8px">${I('check',14)} Clearance ${M.unlocked} unlocked: ${esc(LEVELS[M.unlocked].rule.replace('+ ',''))}</p>`
    : G.lvl < 5 && G.lvl === CR.lvlMax ? `<p class="mute sm" style="margin-top:8px">Next goal: a B or better at clearance ${G.lvl} unlocks clearance ${G.lvl+1}.</p>` : '';
  return `<div class="card"><div class="lbl"><span>Career</span><span>+${M.gain} XP</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px"><b>${rankOf(L)} · level ${L}</b><span class="mute">${M.xpAfter} / ${hi} XP</span></div>
    <div class="bar"><b style="width:${pct}%"></b></div>${M.after > M.before ? `<p class="ok sm" style="margin-top:6px">Level up!</p>` : ''}${goal}
    ${M.ach.map(id => `<div class="ach new">${I('check',14)}<span><b>${ACH[id][0]}</b> · ${ACH[id][1]}</span></div>`).join('')}</div>`;
}
function endHTML(){
  const G = GS, o = OUT[G.res.kind], sc = score(G), s = G.sc, C = s.C, p = probs(G), lb = best(p);
  const truth = C.truth, lesson = esc(C.lesson), Ev = envOf(G), head = (C.outH && C.outH[G.res.kind]) || o.h;
  const fp = C.people.map((x,i) => ({x,i})).filter(o => !o.x.crowd);
  return `${CLASSBAR}<div class="end">
   <div class="hero ${o.g?'good':'bad'}"><div class="grade ${o.g?'ok':'no'}">${sc.grade}</div><h1>${esc(head)}</h1></div>
   ${callsCard(G)}
   <div class="card"><div class="lbl"><span>Score</span><span>${sc.s}/100</span></div><div class="sc">${sc.L.map(l => `<div><span>${esc(l[0])}</span><b class="${l[1]>0?'ok':l[1]<0?'no':'mute'}">${l[1]>0?'+':''}${l[1]}</b></div>`).join('')}</div></div>
   <div class="card"><div class="lbl"><span>Your decision</span><span>${hhmm(G.decidedAt ?? G.res.t)}</span></div>
    <div class="verdict">${G.decision ? I(DEC[G.decision].icon,18)+' '+DEC[G.decision].name : 'None'}</div>
    ${G.decision === 'board' ? `<p class="sm" style="margin-top:4px">Legal basis: ${esc(BASIS[G.basis].name)} — ${G.basisOK ? '<span class="ok">valid</span>' : '<span class="no">not valid</span>'}</p>` : ''}
    <p class="mute sm" style="margin-top:4px">Lattice said <span style="color:${HC[lb]}">${HN[lb]} (${Math.round(p[lb]*100)}%)</span>. The truth: <span style="color:${HC[G.truth]}">${HN[G.truth]}</span>.</p></div>
   <div class="card"><div class="lbl"><span>Situation</span><span>${esc(STORIES[G.sc.story].name)}</span></div><p>${truth}</p>${G.truth==='D' ? `<p style="margin-top:6px"><b>${Math.floor(G.saved)} of ${s.people}</b> rescued.</p>` : ''}
    ${!facesOK(G) ? `<p class="mute sm" style="margin-top:6px">No faces could be seen in ${esc(Ev.name.toLowerCase())}: this case had to be solved from movement, radio, registry and links.</p>` : ''}</div>
   ${uplinkCard(G, sc)}
   <details class="more dbx"><summary>${I('folder',14)} Full debrief</summary><div class="morein">
   <p class="mute sm">Case ${CASE_NO} · ${esc(Ev.name)} · ${hhmm(G.res.t)} · seed ${esc(G.seed)}</p>
   ${!facesOK(G) ? '' : `<div class="card"><div class="lbl"><span>Who was really on board</span><span>${esc(STORIES[G.sc.story].name)}</span></div>
    ${fp.map(({x,i}) => `<div class="ev" style="border-color:${x.same?'var(--green)':'var(--red)'}"><b>${esc(x.n)} · ${x.m}% match → ${x.same ? 'really them' : 'NOT them'}</b>
      <span>You ${G.ids[i]==='yes'?'confirmed':G.ids[i]==='no'?'rejected':'never resolved'} this match. ${((G.ids[i]==='yes')===x.same && G.ids[i]) ? '<span class="ok">✓</span>' : G.ids[i] ? '<span class="no">✗</span>' : ''} ${x.truthNote ? esc(x.truthNote) : ''}</span></div>`).join('')}</div>`}
   ${debriefExtra(G, sc, p, lb)}
   <div class="card"><div class="lbl"><span>The lesson</span></div><p>${lesson}</p></div>
   <div class="card"><div class="lbl"><span>Audit log (what oversight sees)</span></div><div class="audit">${G.audit.map(a => `<div class="${/OVERRIDE/.test(a.m)?'no':''}">${hhmm(a.t)} ${esc(a.m)}</div>`).join('')}</div></div>
   ${careerCard(G)}
   </div></details>
   <div class="endbar"><button class="btn pri big" data-act="newRun">${I('play',18)} New case</button>${G.daily ? `<button class="btn" data-act="copy" data-day="${G.daily}" id="copyb">Share result</button>` : '<button class="btn" data-act="replay">Replay seed</button>'}</div>
   ${G.daily && G.shareOpen ? `<textarea class="share" readonly aria-label="Share text">${esc(shareText(G.daily))}</textarea>` : ''}
   ${sessionCases >= 3 && sessionCases % 3 === 0 ? '<p class="mute sm" style="text-align:center">Good place to stop: your career and archive are saved.</p>' : ''}
  </div>`;
}
